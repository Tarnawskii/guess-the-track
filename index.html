<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Guess The Track</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#120a0e" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GuessTrack" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=VT323&display=swap" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/tv.css" />
</head>
<body>
<div id="ambient" aria-hidden="true"><i></i><i></i></div>
<div id="shell">
<div id="live">
  <button id="liveBtn" type="button" aria-expanded="false" aria-controls="connText" title="Spotify connection"><span id="led" class="led" aria-hidden="true"></span><span id="connText" role="status">not connected</span></button>
  <button id="reconnect" type="button" title="Log in to Spotify again">reconnect</button>
</div>
<div id="app">
  <div class="lava" aria-hidden="true"><i></i><i></i><i></i></div>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="taTube" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b5a55" /><stop offset="0.45" stop-color="#fbe9d0" /><stop offset="1" stop-color="#8a7266" /></linearGradient>
      <linearGradient id="taMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9d0" /><stop offset="0.5" stop-color="#b49a88" /><stop offset="1" stop-color="#4a3a3c" /></linearGradient>
      <linearGradient id="flOuter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4f81" /><stop offset="0.55" stop-color="#ff7a2f" /><stop offset="1" stop-color="#ffc23d" /></linearGradient>
      <linearGradient id="flCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd36a" /><stop offset="1" stop-color="#fff4c9" /></linearGradient>
      <symbol id="flameShape" viewBox="0 0 24 30">
        <path style="fill: var(--f1)" d="M12 1C13 6 17 8.5 19.5 13c2 3.6 1.9 8.6-.9 12-1.7 2.1-4 3.5-6.6 3.5S7.1 27.1 5.4 25C2.6 21.6 2.6 17 4.6 13.6c.8 2.6 2.2 4 3.8 4.6C7.8 11.6 9.6 5.6 12 1z" />
        <path style="fill: var(--f2)" d="M12.6 13.5c.6 3.1 3 4.7 3.7 7.5.7 2.9-1.3 5.6-4.3 5.6S7.4 24.2 7.9 21.6c.3-1.4 1.1-2.4 2-3.2.3 1.4 1 2.2 1.8 2.5-.5-2.6-.1-5.3.9-7.4z" />
      </symbol>
    </defs>
  </svg>
  <header>
    <h1>Guess the Track</h1>
    <div class="menu-wrap">
      <button id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2.25" /><circle cx="9" cy="17" r="2.25" />
        </svg>
      </button>
      <div id="menu" role="group" aria-label="Settings">
        <button id="lyrBtn" class="menu-item" type="button" aria-pressed="false"><span class="mi-icon" aria-hidden="true">🎤</span><span class="mi-text"><b>Lyric hints</b><small>from lrclib.net, karaoke after</small></span><span class="switch" aria-hidden="true"></span></button>
        <button id="vsBtn" class="menu-item" type="button" aria-pressed="false"><span class="mi-icon" aria-hidden="true">VS</span><span class="mi-text"><b>Versus</b><small>same device, or online with your Jam</small></span><span class="switch" aria-hidden="true"></span></button>
        <button id="tvBtn" class="menu-item" type="button"><span class="mi-icon" aria-hidden="true">📺</span><span class="mi-text"><b>Just listen</b><small>retro TV · teletext · charts · for you</small></span><span class="mi-go" aria-hidden="true">↗</span></button>
        <button id="pipBtn" class="menu-item" type="button"><span class="mi-icon" aria-hidden="true">⧉</span><span class="mi-text"><b>Pop-out widget</b><small>always on top · Chrome/Edge</small></span><span class="mi-go" aria-hidden="true">↗</span></button>
        <button id="installBtn" class="menu-item" type="button" hidden><span class="mi-icon" aria-hidden="true">📲</span><span class="mi-text"><b>Add to Home Screen</b><small>open it like an app</small></span><span class="mi-go" aria-hidden="true">＋</span></button>
      </div>
    </div>
  </header>
  <div id="pills">
    <button id="modeBtn" class="pill" type="button" aria-expanded="false" aria-haspopup="dialog" aria-controls="modes" title="Game mode — Quiz, Pick 6, Heardle or Hitster">
      <span id="modeIcon" class="pill-icon" aria-hidden="true">✍️</span><span class="pill-text"><b id="modeName">Quiz</b><small id="modeDesc">◂ game mode</small></span>
    </button>
    <button id="radarBtn" class="pill" type="button" aria-expanded="false" aria-haspopup="dialog" aria-controls="radar" title="Release radar — new music from your artists">
      <span class="pill-icon" aria-hidden="true">📡</span><span class="pill-text"><b>Radar</b><small>new music ▸</small></span>
    </button>
  </div>
  <div id="net"><span id="netLed" class="led"></span><span id="netText"></span><button id="netInvite" hidden>Invite</button><button id="roomsBtn" aria-pressed="false" title="Public rooms — find a game to join">🌍 Find</button><button id="netBtn">Host</button></div>
  <div id="jam">
    <input id="jamLink" type="url" placeholder="Paste your Spotify Jam link so everyone hears it" aria-label="Spotify Jam link" autocomplete="off" />
    <a id="jamJoin" target="_blank" rel="noopener noreferrer"></a>
    <span id="jamHint"></span>
    <button id="pubBtn" type="button" aria-pressed="false">🌍 List this room publicly</button>
    <span id="pubHint"></span>
  </div>
  <div id="lobby" aria-live="polite">
    <div class="lobby-head"><span>Public rooms</span><button id="lobbyRefresh" type="button">Refresh</button><button id="lobbyClose" type="button" aria-label="Close public rooms">✕</button></div>
    <div id="lobbyList"></div>
    <div id="lobbyNote"></div>
    <button id="lobbyLogin" type="button" hidden>Log in with Spotify to host your own</button>
  </div>
  <div class="stats" id="score">
    <div class="stat" id="stPoints"><span>Points</span><b id="sPoints">0</b></div>
    <div class="stat" id="stStreak"><span>Streak</span><div class="streak"><div class="flames" id="flames" aria-hidden="true"></div><b id="sStreak">0</b></div></div>
    <div class="stat"><span>Rounds</span><b id="sRounds">0</b></div>
  </div>
  <div class="stage" id="stage">
    <div class="deck">
      <div class="record" id="record" aria-hidden="true" title="Tap the record to pause or play"><div class="disc" id="disc"><div class="disc-label" id="discLabel"></div></div></div>
      <div class="tonearm" aria-hidden="true">
        <i class="ta-base"></i>
        <svg class="ta-arm" viewBox="0 0 40 104">
          <rect x="13.5" y="0" width="13" height="9" rx="3" fill="url(#taMetal)" />
          <path d="M20 9 L20 80 Q20 87 15.5 91" fill="none" stroke="url(#taTube)" stroke-width="3.4" stroke-linecap="round" />
          <g transform="rotate(24 15.5 94)">
            <rect x="10.5" y="88.5" width="10" height="11.5" rx="1.75" fill="url(#taMetal)" />
            <rect x="12.5" y="97.5" width="6" height="3.5" rx="0.75" fill="#2a0e12" />
            <path d="M20.5 90.5 l5 -2.5" stroke="#b49a88" stroke-width="1.6" stroke-linecap="round" />
          </g>
          <circle cx="20" cy="14" r="4.75" fill="url(#taMetal)" stroke="rgba(0,0,0,0.35)" stroke-width="0.75" />
          <circle cx="20" cy="14" r="1.6" fill="#2a0e12" />
        </svg>
      </div>
      <div id="cover">
        <div class="cover-inner">
          <div class="cover-face cover-front">?</div>
          <div class="cover-face cover-back" id="coverBack"></div>
        </div>
      </div>
    </div>
    <div class="stats" id="vsScore">
      <div class="stat" id="stSongs"><span>Songs</span><b id="sWins">0–0</b></div>
    </div>
  </div>
  <div class="prog"><span id="tNow">0:00</span><div class="bar"><div id="progress"></div></div><span id="tTotal">0:00</span></div>
  <label class="field" id="fArtist"><input id="gArtist" placeholder="Artist" aria-label="Artist" autocomplete="off" /><span class="v" aria-hidden="true"></span></label>
  <label class="field" id="fSong"><input id="gSong" placeholder="Song" aria-label="Song" autocomplete="off" /><span class="v" aria-hidden="true"></span></label>
  <label class="field" id="fYear"><input id="gYear" placeholder="Year" aria-label="Year" inputmode="numeric" maxlength="4" autocomplete="off" /><span class="v" aria-hidden="true"></span></label>
  <div id="heardle">
    <div id="hdBar" aria-hidden="true"><i id="hdOpen"></i><i id="hdFill"></i></div>
    <div class="hd-row"><span id="hdInfo"></span><button id="hdMore" type="button">+ more</button><button id="hdPlay" type="button">▶ replay</button></div>
  </div>
  <div id="timeline">
    <div id="tlHead"><span id="tlInfo"></span><button id="tlNew" type="button">Restart</button></div>
    <div id="tlBoard">
      <div id="tlCards" role="group" aria-label="Your timeline"></div>
      <div id="tlEnds" aria-hidden="true"><span>◂ older</span><span>newer ▸</span></div>
    </div>
  </div>
  <div id="choices" role="group" aria-label="Choices">
    <div id="choiceLabel"></div>
    <div id="choiceList"></div>
  </div>
  <div class="actions">
    <button id="check"><span class="solo-only">Check</span><span class="vs-only">Lock in</span></button>
    <button id="reveal"><span class="solo-only">Reveal</span><span class="vs-only">Pass</span></button>
    <button id="skip">Skip</button>
  </div>
  <div id="status" role="status" aria-live="polite">connecting…</div>
  <div id="lyrics"></div>
  <div id="answer"></div>
  <div id="vsResult" aria-live="polite"></div>
  <footer><span class="solo-only"><kbd>⏎</kbd> next field · <kbd>Ctrl ⏎</kbd> check · no peeking at Spotify</span><span class="vs-only">one shot each · <kbd>Ctrl ⏎</kbd> lock in · song ends = time's up</span></footer>
</div>
<div id="radarScrim" aria-hidden="true"></div>
  <div id="modes" class="bubble" role="dialog" aria-label="Game mode">
    <div class="lobby-head"><span>Game mode</span><button id="modesClose" type="button" aria-label="Close game mode">✕</button></div>
    <div id="modesBody">
      <div id="modeList" role="radiogroup" aria-label="Game mode"></div>
      <div id="modeConf"></div>
      <div id="modesNote"></div>
    </div>
  </div>
  <div id="radar" class="bubble" role="dialog" aria-label="Release radar" aria-live="polite">
    <div class="lobby-head"><span>Release radar</span><button id="radarRefresh" type="button">Refresh</button><button id="radarClose" type="button" aria-label="Close release radar">✕</button></div>
    <div class="seg" id="radarSeg" role="group" aria-label="How far back">
      <button data-range="7" aria-pressed="false">Week</button>
      <button data-range="30" aria-pressed="true">Month</button>
      <button data-range="90" aria-pressed="false">3 months</button>
    </div>
    <div id="radarList"></div>
    <div id="radarNote"></div>
    <button id="radarLogin" type="button" hidden>Let Spotify show who you play most</button>
  </div>
</div>
<div id="tvLayer" aria-hidden="true">
  <div class="tv" id="tv" data-ch="1" role="dialog" aria-label="Just listen — retro TV">
    <div class="tv-body">
      <div class="tv-bezel">
        <div class="tv-screen" id="tvScreen">
          <div class="tv-content">
            <div class="tv-ch" id="tvNow"></div>
            <div class="tv-ch" id="tvNew"></div>
            <div class="tv-ch" id="tvQueue"></div>
            <div class="tv-ch" id="tvCover"></div>
          </div>
          <img id="tvArt" alt="" />
          <div id="tvCap" aria-live="off"></div>
          <canvas class="tv-static" id="tvStatic" width="120" height="90"></canvas>
          <div class="tv-osd" id="tvOsd"></div>
          <div class="crt-tint"></div><div class="crt-bloom"></div><div class="crt-wires"></div><canvas class="crt-lines" id="tvLines" width="1" height="1"></canvas><div class="crt-grille"></div><div class="crt-roll"></div>
        </div>
        <span class="tv-brand">GROOVTRON</span>
      </div>
      <div class="tv-panel">
        <span class="tv-grille" aria-hidden="true"></span>
        <div class="tv-btns">
          <button class="tv-btn" type="button" data-ch="1" aria-pressed="true" title="Channel 1 — now playing">1</button>
          <button class="tv-btn" type="button" data-ch="2" aria-pressed="false" title="Channel 2 — Groovtext: new releases, for you, tonight, your charts">2</button>
          <button class="tv-btn" type="button" data-ch="3" aria-pressed="false" title="Channel 3 — queue">3</button>
          <button class="tv-btn" type="button" data-ch="4" aria-pressed="false" title="Channel 4 — the cover, big">4</button>
          <button class="tv-btn" type="button" data-tv="prev" title="Previous song" aria-label="Previous song">⏮</button>
          <button class="tv-btn" type="button" data-tv="play" title="Play / pause" aria-label="Play or pause">⏯</button>
          <button class="tv-btn" type="button" data-tv="next" title="Next song" aria-label="Next song">⏭</button>
          <button class="tv-btn" type="button" data-tv="fx" aria-pressed="false" title="Stronger CRT effect">FX</button>
          <button class="tv-btn" type="button" data-tv="era" title="Picture tube: 80s (tap for the next decade)">'80</button>
          <button class="tv-btn" type="button" data-tv="pip" hidden title="Float the TV over other apps (picture-in-picture)" aria-label="Picture-in-picture">PiP</button>
        </div>
        <span class="tv-led" id="tvLed" aria-hidden="true"></span>
        <button class="tv-power" type="button" data-tv="power" title="Turn off" aria-label="Turn off the TV">⏻</button>
      </div>
    </div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/turntable.js"></script>
<script src="js/round.js"></script>
<script src="js/versus.js"></script>
<script src="js/spotify.js"></script>
<script src="js/menu.js"></script>
<script src="js/lyrics.js"></script>
<script src="js/online.js"></script>
<script src="js/lobby.js"></script>
<script src="js/modes.js"></script>
<script src="js/radar.js"></script>
<script src="js/tv.js"></script>
<script src="js/groovtext.js"></script>
<script src="js/tv-video.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
