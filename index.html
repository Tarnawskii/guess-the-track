  els.pubBtn.hidden = !host;
  els.pubBtn.disabled = !(net.peer && net.peer.open);
  els.pubBtn.setAttribute("aria-pressed", String(pub.on));
  els.pubBtn.textContent = pub.on ? (pub.slot >= 0 ? "🌍 Public — anyone can find this room" : "🌍 Listing…") : "🌍 List this room publicly";
  els.pubHint.hidden = !(host && pub.on && pub.slot >= 0);
  els.pubHint.textContent = net.jam ? "heads up: strangers can join your Jam too — check who can add songs in its settings"
    : "listed — add a Jam link above, or the people who join won't hear the music";
}

function renderNet() {
  const host = net.role === "host", guest = net.role === "guest", linked = netLinked();
  const open = host && net.peer && net.peer.open, friends = netGuests();
  els.netBtn.textContent = guest ? "Leave" : host ? "Stop" : "Host";
  els.netBtn.title = net.role ? "" : "Host an online room — up to " + MAX_PLAYERS + " players";
  els.roomsBtn.hidden = !!net.role;
  els.netInvite.hidden = !open;
  els.netLed.className = "led " + (linked ? "on" : net.role ? "wait" : "");
  els.netText.textContent =
    guest ? (linked ? "online · " + pname(0) + "'s room" + (vs.players.length > 2 ? " · " + vs.players.filter((p, i) => present(i)).length + " here" : "") : "joining room " + net.code + "…")
    : host ? (!open ? "opening a room…" : "room " + net.code + " · " + (friends ? friends + (friends === 1 ? " friend" : " friends") + " in" : "invite the Jam"))
    : "same device — or online";
  renderPlayers();
  renderJam();
}

function makeCode() {
  const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(5)), (b) => abc[b % abc.length]).join("");
}

async function startHosting() {
  if (net.role) return;
  net.role = "host";
  renderNet();
  try { await loadPeerJs(); } catch (e) { net.role = null; renderNet(); setStatus("online play unavailable — " + e.message); return; }
  if (net.role !== "host") return;
  net.code = makeCode();
  net.jam = jamUrl(els.jamLink.value);
  // a new room is a new game: the host on seat 0, everyone else pulls up a chair as they join
  net.conns = [null]; net.seatOf = new Map();
  vs.players = [{ name: localPlayers()[0].name, points: 0, wins: 0 }];
  vs.guesses = [];
  updateScore();
  const peer = new Peer("gtt-" + net.code, peerOptions());
  net.peer = peer;
  peer.on("open", () => { console.log("[gtt] hosting room", net.code); renderNet(); });
  peer.on("connection", (conn) => {
    conn.on("data", (msg) => { try { onHostData(conn, msg); } catch (e) { console.error("[gtt] bad message", e); } });
    conn.on("close", () => hostDrop(conn));
  });
  peer.on("disconnected", () => { if (net.peer === peer && !peer.destroyed) peer.reconnect(); });
  peer.on("error", (e) => {
    console.error("[gtt] peer error", e.type, e);
    if (net.peer !== peer) return;
    if (e.type === "unavailable-id") { stopHosting(true); startHosting(); return; }
    if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "browser-incompatible") {
      stopHosting(true); setStatus("couldn't open a room (" + e.type + ")");
    }
  });
  replayRound();
}

function stopHosting(quiet) {
  if (net.role !== "host") return;
  setPublic(false);
  netSend({ t: "bye" });
  const peer = net.peer;
  Object.assign(net, { role: null, peer: null, conns: [], seatOf: new Map(), code: null, lastResult: null, jam: "" });
  if (peer) setTimeout(() => peer.destroy(), 200);
  vs.players = localPlayers(); vs.guesses = [];
  updateScore();
  renderNet();
  if (!quiet) replayRound();
}

// a guest says hi (and again after every reload): give them a seat — their old one if they had one
function hostSeat(conn, msg) {
  const id = str(conn.metadata && conn.metadata.id, 40) || conn.peer;
  let seat = net.seatOf.get(id);
  if (seat === undefined) {
    if (vs.players.length >= MAX_PLAYERS) { sendTo(conn, { t: "full" }); setTimeout(() => conn.close(), 500); return; }
    seat = vs.players.push({ name: "", points: 0, wins: 0 }) - 1;
    net.seatOf.set(id, seat);
  }
  const old = net.conns[seat];
  net.conns[seat] = conn;
  if (old && old !== conn) old.close();
  const fresh = vs.players[seat].away !== false;
  vs.players[seat].name = str(msg.name, 12);
  vs.players[seat].away = false;
  netSync(conn, seat);
  netSend({ t: "players", players: vs.players });
  updateScore(); renderNet();
  if (fresh) setStatus(pname(seat) + " joined" + (state.track && !state.revealed && !vsMeLocked() ? " — go" : ""));
}

// a guest's link dropped: keep their seat and points for a rejoin, stop waiting on them
function hostDrop(conn) {
  const seat = net.conns.indexOf(conn);
  if (seat < 1) return;
  net.conns[seat] = null;
  vs.players[seat].away = true;
  netSend({ t: "players", players: vs.players });
  updateScore(); renderNet();
  setStatus(pname(seat) + " left — the invite still works");
  vsMaybeResolve();
}

// bring a (re)joining guest up to date
function netSync(conn, seat) {
  const send = (msg) => sendTo(conn, msg);
  send({ t: "hello", seat, players: vs.players, imode: state.imode, jam: net.jam });
  if (!state.track) return;
  const key = state.trackKey;
  if (state.revealed) {
    if (net.lastResult && net.lastResult.key === key) send(net.lastResult);
    return;
  }
  send({ t: "round", key, carry: "", players: vs.players });
  if (state.imode === "pick") {
    if (state.choicesFailed) send({ t: "choices", key, failed: true });
    else if (state.choice.opts) send({ t: "choices", key, opts: state.choice.opts });
  }
  vs.guesses.forEach((g, who) => { if (g) send({ t: "locked", key, who, verb: "locked in" }); });
  if (state.colors && state.colors.key === key) send({ t: "colors", key, colors: state.colors.colors });
  netSendPos(conn);
}

const BAD3 = ["bad", "bad", "bad"];
const str = (v, max = 200) => String(v == null ? "" : v).slice(0, max);

function onHostData(conn, msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.t === "sync") { hostSeat(conn, msg); return; }
  const seat = net.conns.indexOf(conn);
  if (seat < 1) return;
  if (msg.t === "bye") { conn.close(); return; }
  if (msg.t === "name") {
    vs.players[seat].name = str(msg.name, 12);
    netSend({ t: "players", players: vs.players });
    updateScore(); renderNet();
    return;
  }
  if (msg.t !== "guess" || msg.key !== state.trackKey || !state.track || state.revealed || vs.guesses[seat]) return;
  let marks = BAD3;
  if (msg.kind === "type") marks = gradeTyped(str(msg.a), str(msg.s), str(msg.y, 8));
  else if (msg.kind === "pick" && state.choice.accepted && Array.isArray(msg.picks)) {
    marks = state.choice.accepted.map((acc, i) => (acc.includes(str(msg.picks[i])) ? "ok" : "bad"));
  }
  vsLock(marks, msg.kind === "pass" ? "passed" : "locked in", seat);
}

function guestLock(guess) {
  net.myLocked = true;
  netSend({ t: "guess", key: state.trackKey, ...guess });
  showLocked(net.seat, guess.kind === "pass" ? "passed" : "locked in");
}

// guest: the host's roster is the truth, except for my own name
function setPlayers(players) {
  if (!Array.isArray(players) || !players.length) return;
  vs.players = players.slice(0, MAX_PLAYERS).map((p, i) => ({
    name: i === net.seat ? net.myName : str(p && p.name, 12),
    points: Number(p && p.points) || 0,
    wins: Number(p && p.wins) || 0,
    away: !!(p && p.away),
  }));
  updateScore();
}

function seatOk(v) {
  return Number.isInteger(v) && v >= 0 && v < vs.players.length;
}

function cleanTrack(t) {
  t = t || {};
  const art = str(t.artUrl, 500);
  return {
    artists: Array.isArray(t.artists) ? t.artists.map((a) => str(a)) : [],
    song: str(t.song),
    third: { label: "year", answer: Number(t.third && t.third.answer) || 0 },
    artUrl: art.startsWith("https://") ? art : null,
    album: str(t.album),
    duration: Number(t.duration) || 0,
  };
}

function onGuestData(msg) {
  if (!msg || typeof msg !== "object") return;
  switch (msg.t) {
    case "hello":
      if (!Number.isInteger(msg.seat) || msg.seat < 1 || msg.seat >= MAX_PLAYERS) break;
      net.synced = true;
      net.seat = msg.seat;
      if (jamUrl(msg.jam)) net.jam = jamUrl(msg.jam);
      setPlayers(msg.players);
      if (msg.imode === "type" || msg.imode === "pick") setImode(msg.imode);
      renderNet();
      break;
    case "players":
      setPlayers(msg.players);
      renderNet();
      break;
    case "jam":
      net.jam = jamUrl(msg.url);
      renderJam();
      break;
    case "imode":
      if (msg.imode === "type" || msg.imode === "pick") setImode(msg.imode);
      break;
    case "round":
      setPlayers(msg.players);
      newRound({ pending: true }, str(msg.key), str(msg.carry));
      break;
    case "choices":
      if (msg.key !== state.trackKey || state.revealed) break;
      if (msg.failed || !Array.isArray(msg.opts)) { state.choicesFailed = true; applyInputUI(); break; }
      state.choice = { stage: 0, opts: msg.opts.slice(0, 3).map((o) => (Array.isArray(o) ? o.slice(0, 6).map((x) => str(x)) : [])), accepted: null, results: [], picks: [] };
      applyInputUI();
      if (!net.myLocked) renderStage();
      break;
    case "locked":
      if (msg.key !== state.trackKey || state.revealed || !seatOk(msg.who)) break;
      if (msg.who === net.seat) net.myLocked = true;
      showLocked(msg.who, msg.verb === "passed" ? "passed" : "locked in");
      break;
    case "colors":
      if (msg.key !== state.trackKey || !Array.isArray(msg.colors)) break;
      if (msg.colors.length === 2 && msg.colors.every((c) => /^#[0-9a-f]{6}$/i.test(c))) setLabelColors(msg.colors);
      break;
    case "pos":
      state.trackDuration = Number(msg.dur) || 0;
      state.pos = { position_ms: Number(msg.pos) || 0, timestamp_ms: Date.now(), speed: msg.playing ? 1 : 0 };
      setPlaying(!!msg.playing);
      break;
    case "result": {
      if (msg.key !== state.trackKey || state.revealed) break;
      state.track = cleanTrack(msg.track);
      setPlayers(msg.players);
      vs.guesses = [];
      (Array.isArray(msg.guesses) ? msg.guesses : []).slice(0, vs.players.length).forEach((g, i) => {
        if (!g || typeof g !== "object") return;
        vs.guesses[i] = { marks: [0, 1, 2].map((k) => (["ok", "close", "bad"].includes(g.marks && g.marks[k]) ? g.marks[k] : "bad")), earned: Number(g.earned) || 0 };
      });
      vsShowResult(seatOk(msg.w) && vs.guesses[msg.w] ? msg.w : -1, str(msg.msg));
      break;
    }
    case "skip":
      if (msg.key !== state.trackKey || state.revealed) break;
      state.track = cleanTrack(msg.track);
      finish("skipped — no contest", false, "skipped");
      break;
    case "full":
      net.synced = net.closedByHost = true;
      setStatus("that room's full — " + MAX_PLAYERS + " players max");
      break;
    case "bye":
      net.closedByHost = true;
      setStatus(pname(0) + " closed the room");
      break;
  }
}

async function startGuest(code, jam) {
  net.role = "guest"; net.code = code; net.jam = jamUrl(jam);
  net.myName = localPlayers()[1].name;
  state.mode = "guest";
  vs.on = true;
  vs.players = [{ name: "", points: 0, wins: 0 }]; // the host's seat, until they say hello
  els.app.classList.add("vs", "guest");
  renderModeBtn();
  setConn("wait", "no Spotify needed — the host is playing");
  setStatus("joining room " + code + "…");
  renderNet();
  try { await loadPeerJs(); } catch (e) { setStatus("can't go online — " + e.message); return; }
  const peer = new Peer(undefined, peerOptions());
  net.peer = peer;
  peer.on("open", () => {
    const conn = peer.connect("gtt-" + code, { reliable: true, metadata: { id: deviceId() } });
    net.conn = conn;
    conn.on("open", () => {
      setConn("on", "listening along with the host");
      setStatus("joined — waiting for the next song");
      const askSync = () => { if (!net.synced && net.conn === conn && conn.open) { netSend({ t: "sync", name: net.myName }); setTimeout(askSync, 2500); } };
      askSync();
      renderNet();
    });
    conn.on("data", (msg) => { try { onGuestData(msg); } catch (e) { console.error("[gtt] bad message", e); } });
    conn.on("close", () => {
      setConn("off", "disconnected"); renderNet();
      if (!net.closedByHost) setStatus("lost the room — reload the invite to rejoin");
    });
  });
  peer.on("error", (e) => {
    console.error("[gtt] peer error", e.type, e);
    if (e.type === "peer-unavailable") setStatus("no room " + code + " — check the invite");
    else setStatus("connection problem (" + e.type + ") — reload to retry");
    renderNet();
  });
}

let tabId = null;
function deviceId() {
  try {
    let id = localStorage.getItem("gtt_device");
    if (!id) { id = makeCode() + makeCode(); localStorage.setItem("gtt_device", id); }
    return id;
  } catch { return tabId ||= "t" + makeCode() + makeCode(); } // no storage: still unique, so nobody steals a seat
}

addEventListener("pagehide", () => netSend({ t: "bye" }));

function leaveRoom() {

}

els.jamLink.addEventListener("input", () => {

// ---------- public rooms: a serverless lobby on well-known PeerJS ids ----------
// a public room also claims one of LOBBY_SLOTS lobby ids and answers anyone who knocks with
// what's on; the room browser knocks on every slot and lists whoever answers

function setPublic(on) {
  pub.on = on && net.role === "host";
  if (pub.on) claimSlot(0, Math.floor(Math.random() * LOBBY_SLOTS)); else dropSlot();
  renderJam();
}

function dropSlot() {
  if (pub.peer) pub.peer.destroy();
  pub.peer = null; pub.slot = -1;
}

// try slots from a random start so two hosts don't fight over slot 0
function claimSlot(tries, start) {
  dropSlot();
  if (!pub.on || net.role !== "host") return;
  if (tries >= LOBBY_SLOTS) {
    pub.on = false; renderJam();
    setStatus("the public lobby is full — share the invite link instead");
    return;
  }
  const slot = (start + tries) % LOBBY_SLOTS;
  const peer = new Peer(lobbyId(slot), peerOptions());
  pub.peer = peer;
  peer.on("open", () => {
    if (pub.peer !== peer) return;
    pub.slot = slot; renderJam();
    console.log("[gtt] listed publicly in slot", slot);
    setStatus("room listed — anyone can find it under VS → 🌍 Find");
  });
  // a message sent the instant a channel opens can get lost, so the browser keeps asking until it hears back
  peer.on("connection", (conn) => {
    conn.on("open", () => { sendTo(conn, roomInfo()); setTimeout(() => conn.close(), 4000); });
    conn.on("data", (m) => { if (m && m.t === "who") sendTo(conn, roomInfo()); });
  });
  peer.on("disconnected", () => { if (pub.peer === peer && !peer.destroyed) peer.reconnect(); });
  peer.on("error", (e) => {
    if (pub.peer !== peer) return;
    if (e.type === "unavailable-id") { claimSlot(tries + 1, start); return; }
    console.error("[gtt] lobby error", e.type, e);
    if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "browser-incompatible") {
      pub.on = false; dropSlot(); renderJam();
      setStatus("couldn't list the room (" + e.type + ")");
    }
  });
}

function roomInfo() {
  return {
    t: "room", v: 1, code: net.code, name: pname(0), imode: state.imode, jam: net.jam,
    players: vs.players.filter((p, i) => present(i)).length, full: vs.players.length >= MAX_PLAYERS,
  };
}

function cleanRoom(m) {
  if (!m || typeof m !== "object" || m.t !== "room") return null;
  const code = str(m.code, 8).toUpperCase();
  if (!/^[A-Z0-9]{4,8}$/.test(code)) return null;
  return {
    code, name: str(m.name, 12).trim() || "someone", jam: jamUrl(m.jam), imode: m.imode === "pick" ? "pick" : "type",
    players: Math.max(1, Math.min(MAX_PLAYERS, Math.floor(Number(m.players)) || 1)), full: !!m.full,
  };
}

async function scanRooms() {
  if (lobby.scanning) return;
  lobby.rooms.clear(); lobby.error = ""; lobby.scanning = true;
  renderLobby();
  try { await loadPeerJs(); } catch (e) { lobby.scanning = false; lobby.error = "can't look for rooms — " + e.message; renderLobby(); return; }
  const peer = new Peer(undefined, peerOptions());
  lobby.peer = peer;
  const pending = new Set();
  let timer = 0;
  const done = () => {
    if (lobby.peer !== peer) return;
    clearTimeout(timer);
    lobby.peer = null; lobby.scanning = false;
    setTimeout(() => peer.destroy(), 500);
    renderLobby();
  };
  const settle = (i) => { pending.delete(i); if (!pending.size) done(); };
  peer.on("open", () => {
    for (let i = 0; i < LOBBY_SLOTS; i++) {
      pending.add(i);
      const conn = peer.connect(lobbyId(i), { reliable: true });
      let ask = 0;
      conn.on("open", () => {
        const who = () => { if (conn.open && pending.has(i)) { sendTo(conn, { t: "who" }); ask = setTimeout(who, 600); } };
        who();
      });
      conn.on("data", (m) => {
        const room = cleanRoom(m);
        if (!room) return;
        clearTimeout(ask);
        if (lobby.peer === peer) { lobby.rooms.set(room.code, room); renderLobby(); }
        settle(i); conn.close();
      });
      conn.on("close", () => { clearTimeout(ask); settle(i); });
    }
    // empty slots report back once the PeerJS server gives up on them (~5s); this catches a slot whose WebRTC never connects
    timer = setTimeout(done, 8000);
  });
  peer.on("error", (e) => {
    const m = /gtt-lobby-v1-(\d+)/.exec(e.message || "");
    if (e.type === "peer-unavailable") { if (m) settle(Number(m[1])); return; } // empty slot
    console.error("[gtt] lobby scan error", e.type, e);
    lobby.error = "couldn't reach the lobby (" + e.type + ")";
    done();
  });
}

function joinUrl(code, jam) {
  return location.pathname + "?join=" + code + (jam ? "&jam=" + encodeURIComponent(jam) : "");
}

function renderLobby() {
  els.lobby.classList.toggle("show", lobby.open);
  els.roomsBtn.setAttribute("aria-pressed", String(lobby.open));
  if (!lobby.open) return;
  els.lobbyRefresh.disabled = lobby.scanning;
  els.lobbyLogin.hidden = state.mode !== "lobby";
  els.lobbyClose.hidden = state.mode === "lobby"; // nothing else to do here without Spotify
  const rooms = [...lobby.rooms.values()].sort((a, b) => b.players - a.players);
  els.lobbyList.replaceChildren(...rooms.map((r) => {
    const row = document.createElement("div");
    row.className = "room";
    const txt = document.createElement("div");
    const name = document.createElement("b");
    name.textContent = r.name + "'s room";
    const meta = document.createElement("span");
    meta.textContent = r.players + (r.players === 1 ? " player" : " playing") + " · " + (r.imode === "pick" ? "Pick 6" : "Type")
      + " · " + (r.jam ? "🎧 Jam" : "no Jam yet");
    txt.append(name, meta);
    const b = document.createElement("button");
    b.type = "button";
    const mine = net.role === "host" && r.code === net.code;
    b.textContent = mine ? "Yours" : r.full ? "Full" : "Join";
    b.disabled = mine || r.full;
    b.onclick = () => { if (net.peer) net.peer.destroy(); location.href = joinUrl(r.code, r.jam); };
    row.append(txt, b);
    return row;
  }));
  els.lobbyNote.textContent = lobby.scanning ? "looking for rooms…" : lobby.error
    || (rooms.length ? "" : "no public rooms right now — host one: VS → Host → 🌍");
  els.lobbyNote.hidden = !els.lobbyNote.textContent;
}

function setLobbyOpen(open) {
  lobby.open = open;
  renderLobby();
  if (open) scanRooms();
}

els.pubBtn.onclick = () => setPublic(!pub.on);
els.roomsBtn.onclick = () => setLobbyOpen(!lobby.open);
els.lobbyRefresh.onclick = scanRooms;
els.lobbyClose.onclick = () => setLobbyOpen(false);
els.lobbyLogin.onclick = () => { location.href = location.pathname; };

// ---------- game modes: Quiz and Pick 6 (versus too), Heardle and Hitster (solo) ----------
const GAMES = {
  quiz: { icon: "✍️", name: "Quiz", short: "type artist · song · year", desc: "Type the artist, song and year" },
  pick: { icon: "🎲", name: "Pick 6", short: "multiple choice, 3 steps", desc: "Pick from 6 — artist, song, then year" },
  heardle: { icon: "⏱", name: "Heardle", short: "name it from the first seconds", desc: "1 second of intro, then a bit more. Needs Premium" },
  hitster: { icon: "🃏", name: "Hitster", short: "place songs on your timeline", desc: "Before or after? Build a timeline of years" },
};
const SOLO_GAMES = ["heardle", "hitster"];
const HEARDLE_LADDERS = { classic: [1, 2, 4, 7, 11, 16], hard: [0.5, 1, 2, 4, 8], chill: [2, 4, 8, 16, 30] };
// mode + settings live in this browser's localStorage, like the scores and the answer key
const game = { id: "quiz", heardle: { ladder: "classic", guess: "song" }, hitster: { target: 10, lives: 3 } };
try {
  const g = JSON.parse(localStorage.getItem("gtt_game")) || {};
  if (GAMES[g.id]) game.id = g.id;
  if (g.heardle && HEARDLE_LADDERS[g.heardle.ladder]) game.heardle.ladder = g.heardle.ladder;
  if (g.heardle && ["song", "both"].includes(g.heardle.guess)) game.heardle.guess = g.heardle.guess;
  if (g.hitster && [5, 10, 15].includes(g.hitster.target)) game.hitster.target = g.hitster.target;
  if (g.hitster && [1, 3, 5].includes(g.hitster.lives)) game.hitster.lives = g.hitster.lives;
} catch {}
state.imode = game.id === "pick" ? "pick" : "type";
const modes = { open: false, armed: 0 };

function saveGame() {
  try { localStorage.setItem("gtt_game", JSON.stringify(game)); } catch {}
}

// versus (and every guest) only plays Quiz or Pick 6
function activeGame() {
  if (vs.on || net.role) return state.imode === "pick" ? "pick" : "quiz";
  return game.id;
}

// both bubbles fit beside the card only on a wide screen; below that it's one at a time
function crampedScreen() {
  return els.app.ownerDocument.defaultView.matchMedia("(max-width: 63.99rem)").matches;
}

// the pill grows into its bubble: it stretches from the pill's spot and size to the bubble's while the card
// makes room, then the contents fade in; closing runs it backwards and the pill comes back
const BUBBLE_SPRING = "cubic-bezier(0.34, 1.32, 0.64, 1)";
const BUBBLE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
const BUBBLE_IN = "cubic-bezier(0.55, 0, 0.45, 1)";

function bubbleMotion(bubble, pill, open) {
  const show = () => { bubble.classList.toggle("show", open); pill.classList.toggle("away", open); };
  // a toggle mid-flight starts from the finished state, never from a half-built one
  bubble.getAnimations().forEach((a) => { if (a.id === "bubble") a.finish(); });
  [...bubble.children].forEach((el) => el.getAnimations().forEach((a) => { if (a.id === "bubble") a.finish(); }));
  if (reduceMotion.matches || !bubble.animate || !shown(pill) && open) { syncBubbles(); show(); return; }
  const shell = els.shell;
  const sh0 = shell.getBoundingClientRect();
  shell.style.setProperty("--bubble-top", (pill.getBoundingClientRect().top - sh0.top) + "px");
  const p0 = pill.getBoundingClientRect();
  shell.getAnimations().forEach((a) => { if (a.id === "bubble") a.cancel(); });
  if (open) show();
  syncBubbles();
  const sh1 = shell.getBoundingClientRect();
  const shift = sh0.left - sh1.left;
  const r = bubble.getBoundingClientRect(); // the bubble's open spot, where the card is heading
  const p1 = pill.getBoundingClientRect(); // the pill's spot, ditto
  const run = (el, frames, opts) => { const a = el.animate(frames, opts); a.id = "bubble"; return a; };
  if (Math.abs(shift) > 0.5) run(shell, [{ translate: shift + "px 0" }, { translate: "0 0" }], { duration: open ? 560 : 420, easing: BUBBLE_OUT });
  // a bubble inside the shell rides along with the card; a fixed bottom sheet doesn't
  const rides = getComputedStyle(bubble).position !== "fixed";
  const asPill = (p, carry) => ({
    translate: (p.left - r.left - carry) + "px " + (p.top - r.top) + "px",
    clipPath: "inset(0px " + (r.width - p.width) + "px " + (r.height - p.height) + "px 0px round " + p.height / 2 + "px)",
  });
  const full = { translate: "0px 0px", clipPath: "inset(0px 0px 0px 0px round 24px)" };
  const kids = [...bubble.children];
  if (open) {
    const from = asPill(p0, rides ? shift : 0);
    run(bubble, [{ translate: from.translate }, { translate: full.translate }], { duration: 620, easing: BUBBLE_SPRING });
    run(bubble, [{ clipPath: from.clipPath }, { clipPath: full.clipPath }], { duration: 560, easing: BUBBLE_OUT });
    kids.forEach((k, i) => run(k, [{ opacity: 0, translate: "0 0.375rem" }, { opacity: 1, translate: "0 0" }], { duration: 320, delay: 170 + i * 40, easing: BUBBLE_OUT, fill: "backwards" }));
  } else {
    const to = asPill(p1, 0);
    kids.forEach((k) => run(k, [{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: "ease-out", fill: "forwards" }));
    run(bubble, [{ clipPath: full.clipPath }, { clipPath: to.clipPath }], { duration: 400, easing: BUBBLE_IN, fill: "forwards" });
    const fly = run(bubble, [{ translate: full.translate }, { translate: to.translate }], { duration: 420, easing: BUBBLE_IN, fill: "forwards" });
    fly.onfinish = () => {
      show();
      bubble.getAnimations().forEach((a) => { if (a.id === "bubble") a.cancel(); });
      kids.forEach((k) => k.getAnimations().forEach((a) => { if (a.id === "bubble") a.cancel(); }));
    };
  }
}

function syncBubbles() {
  els.shell.classList.toggle("radar-open", radar.open);
  els.shell.classList.toggle("modes-open", modes.open);
  els.radarScrim.classList.toggle("show", radar.open || modes.open);
}

function setPollRate() {
  if (state.mode !== "spotify" || !state.pollTimer) return;
  clearInterval(state.pollTimer);
  // Heardle polls faster: a song Spotify starts on its own should be caught before it gives itself away
  state.pollTimer = setInterval(pollSpotify, activeGame() === "heardle" ? 1500 : CONFIG.pollMs);
}

function setGame(id) {
  if (!GAMES[id] || net.role === "guest") return;
  if (vs.on && SOLO_GAMES.includes(id)) return;
  const prev = game.id;
  const inBubble = (fn) => (modes.open ? morph(els.modes, modesKids, fn) : fn());
  morph(els.app, appKids, () => inBubble(() => switchGame(id, prev)));
  if (prev !== id) popModeBtn();
}

function popModeBtn() {
  if (reduceMotion.matches || !els.modeIcon.animate) return;
  els.modeIcon.animate([{ opacity: 0, rotate: "-120deg", scale: "0.4" }, { opacity: 1, rotate: "0deg", scale: "1" }],
    { duration: 560, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)" });
  els.modeName.parentNode.animate([{ opacity: 0, translate: "-0.75rem 0" }, { opacity: 1, translate: "0 0" }],
    { duration: 420, delay: 60, easing: MORPH_EASE, fill: "backwards" });
  const card = els.modeList.querySelector('[aria-checked="true"]');
  if (card) card.animate([{ scale: "0.94" }, { scale: "1" }], { duration: 480, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)" });
}

function switchGame(id, prev) {
  game.id = id;
  saveGame();
  state.choicesFailed = false;
  setImode(id === "pick" ? "pick" : "type");
  applyInputUI();
  renderModeBtn();
  renderModes();
  setPollRate();
  if (prev === id) return;
  if (prev === "heardle") { heardleStop(); playerCall("play"); } // let the music run again
  if (id === "heardle") { heardleNext(true); return; } // a fresh song, from second zero
  if (!replayRound()) {
    if (id === "hitster") renderTimeline();
    setStatus(GAMES[id].name + " — next song's up");
  }
}

function gameRoundStart() {
  const g = activeGame();
  if (g === "heardle") heardleStart();
  else if (g === "hitster") hitsterStart();
}

function gameRoundEnd() {
  const g = activeGame();
  if (g === "heardle" && hd.key === state.trackKey) {
    // the reward: hear it properly, from the top
    heardleStop();
    api("https://api.spotify.com/v1/me/player/seek?position_ms=0", { method: "PUT" }).then(() => playerCall("play")).catch(() => {});
  }
  if (g === "hitster") renderTimeline();
}

function playerCall(path, body) {
  return api("https://api.spotify.com/v1/me/player/" + path, {
    method: "PUT",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
}

// ----- Heardle: 1 second, then 2, 4, 7… every wrong guess (or "+ more") unlocks a longer snippet
const hd = { key: null, stage: 0, timer: 0, pending: null, busy: false, playingSecs: 0 };

function hdLadder() {
  return HEARDLE_LADDERS[game.heardle.ladder];
}

function fmtSecs(n) {
  return (n < 1 ? "½" : n) + "s";
}

function heardleStop() {
  clearTimeout(hd.timer);
  hd.playingSecs = 0;
  renderHeardle();
}

// switching = just changed modes, so the song that was on doesn't count as skipped
async function heardleNext(switching) {
  if (hd.busy || state.mode !== "spotify") return;
  hd.busy = true;
  els.skip.disabled = true;
  try {
    hd.key = null; // no victory lap for a skipped song
    if (state.track && !state.revealed && !switching) {
      state.rounds += 1; state.streak = 0;
      finish("skipped", false, "skipped");
    }
    heardleStop();
    const q = await spotifyJson("https://api.spotify.com/v1/me/player/queue");
    const item = (q.queue || []).find((t) => t && t.type === "track" && t.id && t.id !== state.trackKey);
    if (!item) { setStatus("nothing up next in Spotify — start a playlist, then hit Skip"); return; }
    hd.pending = { uri: item.uri, ctx: state.context };
    state.expect = { key: item.id, until: Date.now() + 8000 };
    newRound(trackFromItem(item), item.id);
  } catch (e) {
    setStatus(e.status === 404 ? "no active Spotify player — press play in Spotify first" : "couldn't get the next song (" + (e.status || e.message) + ")");
  } finally {
    hd.busy = false;
    setTimeout(() => { els.skip.disabled = false; }, 800);
  }
}

function heardleStart() {
  hd.key = state.trackKey;
  hd.stage = 0;
  setStatus("Heardle — " + fmtSecs(hdLadder()[0]) + " of intro, name it!");
  if (els.app.ownerDocument.hasFocus()) (game.heardle.guess === "both" ? els.artist : els.song).focus();
  heardleSnippet();
}

async function heardleSnippet() {
  const ladder = hdLadder();
  const secs = ladder[Math.min(hd.stage, ladder.length - 1)];
  const key = hd.key;
  clearTimeout(hd.timer);
  let res;
  try {
    if (hd.pending) {
      // switch songs ourselves so the first thing you hear is second zero
      const p = hd.pending;
      hd.pending = null;
      const inContext = p.ctx && !/:artist:/.test(p.ctx);
      res = await playerCall("play", inContext ? { context_uri: p.ctx, offset: { uri: p.uri }, position_ms: 0 } : { uris: [p.uri], position_ms: 0 });
      if (!res.ok && inContext) res = await playerCall("play", { uris: [p.uri], position_ms: 0 });
    } else {
      await api("https://api.spotify.com/v1/me/player/seek?position_ms=0", { method: "PUT" });
      res = await playerCall("play");
    }
  } catch { setStatus("couldn't reach Spotify"); return; }
  if (!res.ok) {
    setStatus(res.status === 403 ? "Heardle needs Spotify Premium to start and stop songs"
      : res.status === 404 ? "no active Spotify player — press play in Spotify first"
      : "couldn't play the snippet (" + res.status + ")");
    return;
  }
  if (hd.key !== key || state.revealed) return;
  hd.playingSecs = secs;
  renderHeardle();
  hd.timer = setTimeout(() => {
    hd.playingSecs = 0;
    renderHeardle();
    if (hd.key === key && !state.revealed) playerCall("pause").catch(() => {});
  }, secs * 1000);
}

function heardleCheck() {
  const t = state.track;
  const both = game.heardle.guess === "both";
  if (!els.song.value.trim() && !(both && els.artist.value.trim())) { heardleMore(); return; } // empty guess = "+ more"
  const sOk = fuzzyMatch(els.song.value, [t.song]);
  const aOk = !both || fuzzyMatch(els.artist.value, t.artists);
  setVerdict(els.fSong, sOk ? "ok" : "bad");
  if (both) setVerdict(els.fArtist, aOk ? "ok" : "bad");
  if (sOk && aOk) {
    const ladder = hdLadder();
    const earned = ladder.length - hd.stage;
    state.rounds += 1; state.points += earned; state.streak += 1;
    finish(hd.stage === 0 ? "first try! unreal ears" : "got it in " + fmtSecs(ladder[hd.stage]) + " — +" + earned, true, "+" + earned);
    popPoints(earned);
    burst();
    return;
  }
  fields.filter((f) => f.classList.contains("bad")).forEach(shake);
  heardleMore(true);
}

function heardleMore(wrong) {
  if (!state.track || state.revealed || activeGame() !== "heardle") return;
  const ladder = hdLadder();
  if (hd.stage >= ladder.length - 1) {
    state.rounds += 1; state.streak = 0;
    finish("out of snippets — 0 points", false, "0");
    return;
  }
  hd.stage += 1;
  setStatus((wrong ? "nope — " : "") + "here's " + fmtSecs(ladder[hd.stage]));
  heardleSnippet();
}

function renderHeardle() {
  if (activeGame() !== "heardle") return;
  const ladder = hdLadder();
  const max = ladder[ladder.length - 1];
  const stage = Math.min(hd.stage, ladder.length - 1);
  const open = state.revealed ? 1 : ladder[stage] / max;
  els.hdOpen.style.width = (open * 100).toFixed(2) + "%";
  els.hdBar.querySelectorAll("s").forEach((t) => t.remove());
  ladder.slice(0, -1).forEach((n) => {
    const tick = document.createElement("s");
    tick.style.left = (n / max * 100).toFixed(2) + "%";
    els.hdBar.append(tick);
  });
  // the fill runs across the snippet while it plays
  const fill = els.hdFill;
  fill.style.transition = "none";
  fill.style.width = "0";
  if (hd.playingSecs && !reduceMotion.matches) {
    void fill.offsetWidth;
    fill.style.transition = "width " + hd.playingSecs + "s linear";
    fill.style.width = (hd.playingSecs / max * 100).toFixed(2) + "%";
  }
  const left = ladder.length - stage;
  els.hdInfo.textContent = state.revealed ? "" : fmtSecs(ladder[stage]) + " · worth " + left + (left === 1 ? " point" : " points");
  els.hdMore.disabled = els.hdPlay.disabled = !state.track || state.revealed;
  els.hdMore.textContent = stage >= ladder.length - 1 ? "give up" : "+ more";
}

els.hdPlay.onclick = () => { if (state.track && !state.revealed) heardleSnippet(); };
els.hdMore.onclick = () => heardleMore(false);

// ----- Hitster: one free starter card, then place every song before, between or after the ones you have
let hs = { cards: [], lives: game.hitster.lives, maxLives: game.hitster.lives, target: game.hitster.target, over: false, last: null };
try {
  const saved = JSON.parse(localStorage.getItem("gtt_hitster"));
  if (saved && Array.isArray(saved.cards)) hs = { ...hs, ...saved, last: null };
} catch {}
let restartArmedAt = 0;

function hsSave() {
  try { localStorage.setItem("gtt_hitster", JSON.stringify({ cards: hs.cards, lives: hs.lives, maxLives: hs.maxLives, target: hs.target, over: hs.over })); } catch {}
}

function hsWon() {
  return hs.cards.length >= hs.target;
}

function hsCard() {
  const t = state.track;
  return { key: state.trackKey, year: t.third.answer, song: t.song, artist: t.artists[0] || "" };
}

function hitsterNewGame() {
  hs = { cards: [], lives: game.hitster.lives, maxLives: game.hitster.lives, target: game.hitster.target, over: false, last: null };
  hsSave();
  if (!replayRound()) { renderTimeline(); setStatus("new timeline — the next song is your free starter card"); }
  renderModes();
}

function hitsterStart() {
  hs.last = null;
  if (hs.over || hsWon()) {
    renderTimeline();
    setStatus(hsWon() ? "you won this timeline — hit New game for another" : "game over — hit New game to go again");
    return;
  }
  if (!hs.cards.length) {
    hs.cards.push(hsCard());
    hs.last = { key: state.trackKey, ok: true };
    hsSave();
    state.rounds += 1;
    finish("your starter card: " + state.track.third.answer + " — now place the next one", true, "starter");
    return;
  }
  renderTimeline();
  setStatus("where does this one go? tap a ＋");
}

function hitsterPlace(i) {
  if (!state.track || state.revealed || hs.over || hsWon()) return;
  const card = hsCard();
  const before = hs.cards[i - 1], after = hs.cards[i];
  const ok = (!before || before.year <= card.year) && (!after || card.year <= after.year);
  state.rounds += 1;
  if (ok) {
    hs.cards.splice(i, 0, card);
    hs.last = { key: card.key, ok: true };
    state.points += 1; state.streak += 1;
    if (hsWon()) { finish("you won! " + hs.cards.length + " cards on the timeline", true, "+1"); burst(); }
    else finish(card.year + " — spot on! " + hs.cards.length + "/" + hs.target, true, "+1");
    popPoints(1);
  } else {
    hs.lives -= 1; state.streak = 0;
    hs.last = { key: card.key, ok: false, card };
    if (hs.lives <= 0) { hs.over = true; finish("it was " + card.year + " — game over at " + hs.cards.length + " cards", false, "✗"); }
    else finish("nope, it was " + card.year + " — " + hs.lives + (hs.lives === 1 ? " life" : " lives") + " left", false, "✗");
  }
  hsSave();
  renderTimeline();
  renderModes();
}

// card colour by decade, oldest plum through to the 2020s
const DECADE_COLORS = [[1960, "#b65aa5"], [1970, "#ff4f81"], [1980, "#ff7a2f"], [1990, "#ffc23d"], [2000, "#a8e063"], [2010, "#4fc3d8"], [Infinity, "#b38cff"]];

function decadeColor(year) {
  return DECADE_COLORS.find(([until]) => year < until)[1];
}

function renderTimeline() {
  if (activeGame() !== "hitster") return;
  const open = !!state.track && !state.revealed && !hs.over && !hsWon() && hs.cards.length > 0;
  const lost = Math.max(0, hs.maxLives - hs.lives);
  els.tlInfo.textContent = hs.cards.length + "/" + hs.target + " cards · " + "❤️".repeat(Math.max(0, hs.lives)) + "🖤".repeat(Math.min(lost, 5));
  els.tlNew.textContent = hs.over || hsWon() ? "New game" : "Restart";
  const scroller = els.tlCards;
  const keepLeft = scroller.scrollLeft;
  const items = [];
  if (!hs.cards.length) {
    // an empty board still looks like a board: this is where the starter card lands
    const spot = document.createElement("div");
    spot.className = "tl-card ghosty";
    const q = document.createElement("b");
    q.textContent = "?";
    const t = document.createElement("span");
    t.textContent = "next song is your free starter card";
    spot.append(q, t);
    items.push(spot);
  }
  const miss = hs.last && !hs.last.ok && hs.last.key === state.trackKey ? hs.last.card : null;
  const missAt = miss ? hs.cards.filter((c) => c.year <= miss.year).length : -1;
  hs.cards.forEach((c, i) => {
    if (i === missAt) items.push(tlChip(miss, "bad"));
    items.push(tlSlot(i, open));
    items.push(tlChip(c, hs.last && hs.last.ok && hs.last.key === c.key && c.key === state.trackKey ? "fresh" : ""));
  });
  if (hs.cards.length) {
    if (missAt === hs.cards.length) items.push(tlChip(miss, "bad"));
    items.push(tlSlot(hs.cards.length, open));
  }
  scroller.replaceChildren(...items);
  // follow the action: centre the card that just landed (or missed), otherwise stay where you were
  const focus = scroller.querySelector(".fresh, .bad");
  scroller.scrollLeft = keepLeft;
  if (focus) {
    const left = focus.offsetLeft - scroller.clientWidth / 2 + focus.offsetWidth / 2;
    scroller.scrollTo({ left, behavior: reduceMotion.matches ? "auto" : "smooth" });
  }
}

function tlSlot(i, open) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "slot";
  b.textContent = "＋";
  b.disabled = !open;
  b.style.animationDelay = (i * 30) + "ms";
  b.setAttribute("aria-label", i === 0 ? "Place before everything" : i === hs.cards.length ? "Place after everything" : "Place between " + hs.cards[i - 1].year + " and " + hs.cards[i].year);
  b.onclick = () => hitsterPlace(i);
  return b;
}

function tlChip(c, cls) {
  const d = document.createElement("div");
  d.className = "tl-card" + (cls ? " " + cls : "");
  if (cls !== "bad") d.style.setProperty("--c", decadeColor(c.year)); // a miss stays red
  d.title = c.song + " — " + c.artist + " (" + c.year + ")";
  const y = document.createElement("b");
  y.textContent = c.year;
  const t = document.createElement("span");
  t.textContent = c.song;
  const a = document.createElement("small");
  a.textContent = c.artist;
  d.append(y, t, a);
  return d;
}

// a mouse wheel scrolls the board sideways when it's wider than the card
els.tlCards.addEventListener("wheel", (e) => {
  const sc = els.tlCards;
  if (sc.scrollWidth <= sc.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  sc.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });

els.tlNew.onclick = () => {
  if (!hs.over && !hsWon() && hs.cards.length > 1 && Date.now() - restartArmedAt > 4000) {
    restartArmedAt = Date.now();
    setStatus("tap Restart again — this timeline will be gone");
    return;
  }
  hitsterNewGame();
};

// ----- the mode button on the card and the bubble on its left
function renderModeBtn() {
  const g = GAMES[activeGame()];
  els.modeIcon.textContent = g.icon;
  els.modeName.textContent = g.name;
  els.modeDesc.textContent = net.role === "guest" ? "the host's pick" : "◂ game mode";
  els.modeBtn.title = net.role === "guest" ? "The host picks the mode" : g.name + " — " + g.short;
  els.modeBtn.disabled = net.role === "guest";
  els.modeBtn.setAttribute("aria-expanded", String(modes.open));
}

function confRow(label, options, current, pick) {
  const row = document.createElement("div");
  row.className = "conf";
  const name = document.createElement("span");
  name.textContent = label;
  const seg = document.createElement("div");
  seg.className = "seg";
  seg.setAttribute("role", "group");
  seg.setAttribute("aria-label", label);
  for (const [value, text] of options) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.setAttribute("aria-pressed", String(value === current));
    b.onclick = () => {
      for (const o of seg.children) o.setAttribute("aria-pressed", String(o === b));
      morph(els.app, appKids, () => pick(value)); // e.g. Heardle's artist field coming or going
      saveGame();
      renderModes();
    };
    seg.append(b);
  }
  row.append(name, seg);
  return row;
}

function renderModes() {
  renderModeBtn();
  if (!modes.open) return;
  const cur = activeGame();
  if (!els.modeList.children.length) {
    els.modeList.append(...Object.entries(GAMES).map(([id, g]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mode-card";
      b.dataset.game = id;
      b.setAttribute("role", "radio");
      const icon = document.createElement("i");
      icon.textContent = g.icon;
      const name = document.createElement("b");
      name.textContent = g.name;
      b.append(icon, name, document.createElement("span"));
      b.onclick = () => setGame(id);
      return b;
    }));
  }
  [...els.modeList.children].forEach((b, i) => {
    const id = b.dataset.game;
    const locked = (vs.on || !!net.role) && SOLO_GAMES.includes(id);
    b.setAttribute("aria-checked", String(id === cur));
    b.disabled = locked || net.role === "guest";
    b.lastChild.textContent = locked ? "solo only — turn off VS to play" : GAMES[id].desc;
    if (modes.animate) {
      b.classList.remove("in");
      void b.offsetWidth; // restart the slide-in
      b.style.setProperty("--i", i);
      b.classList.add("in");
    }
  });
  modes.animate = false;
  renderModesNote(cur);
  if (modes.confFor === cur) return;
  modes.confFor = cur;
  const conf = [];
  if (cur === "heardle") {
    conf.push(confRow("Snippets", [["classic", "1 → 16s"], ["hard", "½ → 8s"], ["chill", "2 → 30s"]], game.heardle.ladder, (v) => {
      game.heardle.ladder = v;
      hd.stage = Math.min(hd.stage, hdLadder().length - 1);
      renderHeardle();
    }));
    conf.push(confRow("Guess", [["song", "Song"], ["both", "Artist + song"]], game.heardle.guess, (v) => { game.heardle.guess = v; applyInputUI(); }));
  } else if (cur === "hitster") {
    conf.push(confRow("Cards to win", [[5, "5"], [10, "10"], [15, "15"]], game.hitster.target, (v) => {
      game.hitster.target = v;
      if (!hs.over && hs.cards.length < v) { hs.target = v; hsSave(); renderTimeline(); }
    }));
    conf.push(confRow("Lives (from the next game)", [[1, "1"], [3, "3"], [5, "5"]], game.hitster.lives, (v) => { game.hitster.lives = v; }));
    const again = document.createElement("button");
    again.type = "button";
    again.id = "modesNew";
    again.textContent = "New game";
    again.onclick = hitsterNewGame;
    conf.push(again);
  } else {
    conf.push(confRow("Lyric hint 🎤", [[false, "Off"], [true, "On"]], lyricsOn, (v) => setLyricsOn(v)));
  }
  els.modeConf.replaceChildren(...conf);
}

function renderModesNote(cur) {
  els.modesNote.textContent = net.role === "guest" ? "the host picks the mode for the room"
    : cur === "heardle" ? "Heardle starts and pauses Spotify for you, so it needs Premium. Skip = next song, from second zero."
    : cur === "hitster" ? "Now: " + hs.cards.length + "/" + hs.target + " cards, " + hs.lives + (hs.lives === 1 ? " life" : " lives") + " left. Years come from Spotify's album dates, so remasters can fool you."
    : vs.on ? "Heardle and Hitster are solo for now — versus plays Quiz or Pick 6."
    : "";
}

function setModesOpen(open) {
  if (open === modes.open) return;
  modes.open = open;
  modes.animate = open;
  modes.confFor = null;
  if (open && crampedScreen()) setRadarOpen(false);
  renderModes();
  bubbleMotion(els.modes, els.modeBtn, open);
  if (!open && els.modes.contains(els.modes.ownerDocument.activeElement)) els.modeBtn.focus();
}

els.modeBtn.onclick = () => setModesOpen(!modes.open);
els.modesClose.onclick = () => setModesOpen(false);

renderModeBtn();

// ---------- release radar: the newest albums and singles from the artists you play most ----------
const RADAR_SCOPES = ["user-top-read"];
const RADAR_MAX_DAYS = 90;      // fetched once, the Week/Month/3 months tabs just filter
const RADAR_TTL = 6 * 3600e3;   // cached this long, Refresh skips it
const radar = { open: false, loading: false, done: 0, total: 0, artists: 0, failed: 0, releases: [], at: 0, error: "", flash: "", days: 30, since: "", shown: new Set() };
let radarRenderTimer = 0;

function radarScopeOk() {
  try {
    const granted = (JSON.parse(localStorage.getItem("pip_widget_auth")).scope || "").split(" ");
    return RADAR_SCOPES.every((s) => granted.includes(s));
  } catch { return false; }
}

// local calendar day, n days back, as Spotify writes release dates: YYYY-MM-DD
function isoDay(n = 0) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function relDay(iso) {
  if (iso.length < 10) return iso.slice(0, 4);
  const days = Math.round((new Date(isoDay() + "T00:00") - new Date(iso + "T00:00")) / 864e5);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 7) return days + " days ago";
  return new Date(iso + "T00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function spotifyJson(url) {
  for (let i = 0; ; i++) {
    const res = await api(url);
    if (res.ok) return res.json();
    if (res.status !== 429 || i >= 3) throw Object.assign(new Error("Spotify said " + res.status), { status: res.status });
    const after = Number(res.headers.get("Retry-After")) || 2 ** i;
    if (after > 30) throw Object.assign(new Error("Spotify is rate-limiting us — try again in a bit"), { status: 429 });
    await wait(after * 1000);
  }
}

// your 50 most played artists over the last ~6 months (Spotify's "medium_term")
async function radarArtists() {
  const d = await spotifyJson("https://api.spotify.com/v1/me/top/artists?limit=50&time_range=medium_term");
  return d.items.map((a) => a.id);
}

// newest first within each group, so a handful per group always holds anything recent
async function artistReleases(id, cutoff) {
  const out = [];
  for (const group of ["album", "single"]) {
    const d = await spotifyJson(`https://api.spotify.com/v1/artists/${id}/albums?include_groups=${group}&market=from_token&limit=10`);
    out.push(...d.items.filter((a) => a && a.release_date >= cutoff));
  }
  return out;
}

function cleanRelease(a) {
  const img = (a.images || []).find((i) => i.width && i.width <= 300) || (a.images || []).slice(-1)[0];
  return {
    id: a.id, uri: a.uri, name: a.name, date: a.release_date,
    type: a.album_type === "single" ? (a.total_tracks >= 4 ? "EP" : "Single") : a.album_type === "compilation" ? "Compilation" : "Album",
    tracks: a.total_tracks || 0,
    artists: (a.artists || []).map((x) => x.name).join(", "),
    img: img ? img.url : "",
    url: a.external_urls ? a.external_urls.spotify : "",
  };
}

// a collab shows up once per artist, and clean + explicit versions are separate releases
function dedupeReleases(list) {
  const seen = new Map();
  for (const r of list) {
    const k = r.name.toLowerCase() + "|" + r.artists.split(", ")[0].toLowerCase() + "|" + r.date;
    if (!seen.has(k)) seen.set(k, r);
  }
  return [...seen.values()].sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
}

function readRadarCache() {
  try { return JSON.parse(localStorage.getItem("gtt_radar_v2")) || null; } catch { return null; }
}

async function loadRadar(force) {
  if (radar.loading || state.mode !== "spotify" || !radarScopeOk()) { renderRadar(); return; }
  const cached = readRadarCache();
  if (!force && cached && Date.now() - cached.at < RADAR_TTL) {
    Object.assign(radar, { releases: cached.releases, artists: cached.artists, at: cached.at, failed: 0, error: "" });
    renderRadar();
    return;
  }
  Object.assign(radar, { loading: true, error: "", done: 0, total: 0, failed: 0 });
  renderRadar();
  try {
    const ids = await radarArtists();
    radar.total = ids.length;
    const cutoff = isoDay(RADAR_MAX_DAYS);
    const found = [];
    let next = 0;
    await Promise.all(Array.from({ length: 5 }, async () => {
      while (next < ids.length) {
        const id = ids[next++];
        try { found.push(...(await artistReleases(id, cutoff)).map(cleanRelease)); } catch { radar.failed++; }
        radar.done++;
        radar.releases = dedupeReleases(found);
        if (!radarRenderTimer) radarRenderTimer = setTimeout(() => { radarRenderTimer = 0; renderRadar(); }, 150);
      }
    }));
    radar.artists = ids.length;
    radar.at = Date.now();
    if (ids.length && radar.failed === ids.length) radar.error = "couldn't reach Spotify — hit Refresh";
    else try { localStorage.setItem("gtt_radar_v2", JSON.stringify({ at: radar.at, artists: radar.artists, releases: radar.releases })); } catch {}
  } catch (e) {
    console.error("[gtt] radar failed", e);
    radar.error = e.status === 401 || e.status === 403 ? "Spotify said no — log in again below" : e.message;
    if (e.status === 401 || e.status === 403) try { localStorage.removeItem("gtt_radar_v2"); } catch {}
  }
  radar.loading = false;
  renderRadar();
}

async function playRelease(r, btn) {
  btn.disabled = true;
  try {
    const res = await api("https://api.spotify.com/v1/me/player/play", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ context_uri: r.uri }),
    });
    radar.flash = res.ok ? "playing " + r.name + " — you'll ace this round 😉"
      : res.status === 404 ? "open Spotify on a device first, then hit ▶"
      : res.status === 403 ? "Spotify only lets Premium start playback from here"
      : "couldn't start it (" + res.status + ")";
  } catch { radar.flash = "couldn't reach Spotify"; }
  btn.disabled = false;
  renderRadar();
  setTimeout(() => { radar.flash = ""; renderRadar(); }, 4000);
}

// the shell (and so the card) is moved by bubbleMotion only: shifting it here first made the card jump
// instead of float. While the radar fills up, the bubble grows smoothly instead of in steps
function renderRadar() {
  els.radarBtn.setAttribute("aria-expanded", String(radar.open));
  if (!radar.open) return;
  const bubble = els.radar;
  const settled = bubble.classList.contains("show") && !bubble.getAnimations().some((a) => a.id === "bubble");
  const h0 = settled ? bubble.getBoundingClientRect().height : 0; // mid-grow height counts
  bubble.getAnimations().forEach((a) => { if (a.id === "grow") a.cancel(); });
  renderRadarContent();
  if (!settled || reduceMotion.matches) return;
  const h1 = bubble.getBoundingClientRect().height;
  if (Math.abs(h1 - h0) > 1) {
    const a = bubble.animate([{ height: h0 + "px" }, { height: h1 + "px" }], { duration: 420, easing: MORPH_EASE });
    a.id = "grow";
  }
}

function renderRadarContent() {
  const allowed = radarScopeOk();
  els.radarLogin.hidden = allowed && !/log in again/.test(radar.error);
  els.radarRefresh.disabled = radar.loading || !allowed;
  els.radarSeg.hidden = !allowed;
  els.radarRanges.forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.range) === radar.days)));
  const cutoff = isoDay(radar.days);
  const list = allowed ? radar.releases.filter((r) => r.date >= cutoff) : [];
  let fresh = 0;
  els.radarList.replaceChildren(...list.map((r) => {
    const row = document.createElement("div");
    row.className = "rel";
    // rows slide in one after another the first time they show up, not on every progress repaint
    if (!radar.shown.has(r.id)) {
      radar.shown.add(r.id);
      row.classList.add("in");
      row.style.setProperty("--i", Math.min(fresh++, 12));
    }
    const img = document.createElement("img");
    img.alt = ""; img.loading = "lazy"; img.decoding = "async";
    if (r.img) img.src = r.img;
    const txt = document.createElement("div");
    const title = document.createElement("b");
    if (radar.since && r.date > radar.since) {
      const badge = document.createElement("em");
      badge.textContent = "NEW";
      title.append(badge);
    }
    const link = document.createElement(r.url ? "a" : "span");
    link.textContent = r.name;
    if (r.url) { link.href = r.url; link.target = "_blank"; link.rel = "noopener noreferrer"; }
    title.append(link);
    const who = document.createElement("span");
    who.textContent = r.artists;
    const meta = document.createElement("span");
    meta.textContent = r.type + (r.type === "Single" ? "" : " · " + r.tracks + " tracks") + " · " + relDay(r.date);
    txt.append(title, who, meta);
    const play = document.createElement("button");
    play.type = "button";
    play.textContent = "▶";
    play.title = "Play " + r.name + " in Spotify";
    play.setAttribute("aria-label", play.title);
    play.onclick = () => playRelease(r, play);
    row.append(img, txt, play);
    return row;
  }));
  const span = radar.days === 7 ? "this week" : radar.days === 30 ? "this month" : "in 3 months";
  els.radarNote.textContent = !allowed ? "Spotify has to let the app see which artists you play most — one quick login"
    : radar.flash ? radar.flash
    : radar.loading ? "checking " + (radar.total ? radar.done + "/" + radar.total + " artists" : "who you play most") + "…"
    : radar.error ? radar.error
    : !radar.artists ? "Spotify doesn't know your favourites yet — play some music and check back"
    : list.length ? list.length + (list.length === 1 ? " release" : " releases") + " from " + radar.artists + " artists" + (radar.failed ? " · " + radar.failed + " couldn't be checked" : "")
    : "nothing new from your " + radar.artists + " artists " + span + (radar.days < 90 ? " — try a longer stretch" : "");
}

function setRadarOpen(open) {
  if (open === radar.open) return;

    let visit = {};

    if (visit.day !== isoDay()) visit = { day: isoDay(), prev: visit.day || "" };
    try { localStorage.setItem("gtt_radar_visit", JSON.stringify(visit)); } catch {}
    radar.since = visit.prev;

}

function copyStylesTo(doc) {
  for (const sheet of document.styleSheets) {
    try {
      const style = doc.createElement("style");
      style.textContent = Array.from(sheet.cssRules).map((r) => r.cssText).join("\n");
      doc.head.appendChild(style);
    } catch {
      if (!sheet.href) continue;
      const link = doc.createElement("link");
      link.rel = "stylesheet"; link.href = sheet.href;
      doc.head.appendChild(link);
    }
  }
}

// scanlines, one canvas row per physical pixel and nudged onto the pixel grid, so they stay crisp lines at any
// display scaling (100%, 125%, 150%, retina) instead of smearing into grey or flicker
function tvScanlines() {
  const win = T.screen.ownerDocument.defaultView;
  const dpr = win.devicePixelRatio || 1;
  const r = T.screen.getBoundingClientRect();
  if (!r.height) return;
  const H = Math.round(r.height * dpr) + 2;
  const pitch = Math.max(dpr < 1.5 ? 2 : 3, Math.round((r.height * dpr) / 220)); // device pixels per line, ~220 lines
  const gap = Math.max(1, Math.round(pitch * 0.4));
  const c = T.lines;
  c.width = 1;
  c.height = H;
  c.style.height = H / dpr + "px";
  const ctx = c.getContext("2d");
  for (let y = 0; y < H; y++) {
    const i = y % pitch;
    // lit rows, a softer row either side of the gap when there's room for one, then the dark gap
    const v = i >= pitch - gap ? 58 : pitch >= 4 && (i === 0 || i === pitch - gap - 1) ? 190 : 255;
    ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
    ctx.fillRect(0, y, 1, 1);
  }
  const frac = (r.top * dpr) % 1; // the screen can sit between physical pixels; line the rows up anyway
  c.style.transform = frac > 0.001 ? "translateY(" + (-frac / dpr).toFixed(4) + "px)" : "";
  T.screen.style.setProperty("--gap", gap / dpr + "px");
}

function tvPower(on) {
  const screen = T.screen;
  const led = T.led;
  led.classList.toggle("standby", !on);
  screen.classList.remove("power-on", "power-off");
  void screen.offsetWidth;
  if (!reduceMotion.matches) {
    screen.classList.add(on ? "power-on" : "power-off");
    if (on) setTimeout(() => { screen.classList.remove("power-on"); tvPlaceArt(); }, 760);
  }
  if (on) tvOsd("CH " + tv.ch + " " + TV_CHANNELS[tv.ch]);
}

function tvOsd(text) {
  const osd = T.osd;
  osd.textContent = text;
  osd.classList.add("show");
  clearTimeout(tv.osdTimer);
  tv.osdTimer = setTimeout(() => osd.classList.remove("show"), 1600);
}

// a burst of snow, drawn on a tiny canvas and blown up pixelated
function tvStatic(ms = 320) {
  if (reduceMotion.matches) return;
  const c = T.snow;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(c.width, c.height);
  const win = c.ownerDocument.defaultView;
  const end = performance.now() + ms;
  c.classList.add("burst");
  T.screen.classList.add("snowing");
  const frame = (t) => {
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    if (t < end) win.requestAnimationFrame(frame);
    else { c.classList.remove("burst"); T.screen.classList.remove("snowing"); }
  };
  win.requestAnimationFrame(frame);
}

function tvSetChannel(ch) {
  if (tv.ch === ch) return;
  tv.ch = ch;
  try { localStorage.setItem("gtt_tv_ch", String(ch)); } catch {}
  tvShowChannel();
  tvStatic(260);
  tvOsd("CH " + ch + " " + TV_CHANNELS[ch]);
  if (ch === 3 && Date.now() - tv.queueAt > 5000) tvLoadQueue();
  tvTick(true);
  tvPlaceArt();
}

function tvShowChannel() {
  T.box.dataset.ch = String(tv.ch);
  T.box.querySelectorAll(".tv-btn[data-ch]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.ch) === tv.ch)));
}

function tvTick(force) {
  if (!tv.open) return;
  const t = state.track;
  if (state.trackKey !== tv.key) {
    const first = tv.key === null;
    tv.key = state.trackKey;
    if (!first) { tvStatic(); setTimeout(tvLoadQueue, 900); }
    tvRenderNow(true);
    if (tv.ch === 3) tvRenderQueue();
    if (tv.ch === 4) tvRenderCover(true);
  }
  if (tv.ch === 1) tvRenderNow(force);
  if (tv.ch === 4) tvRenderCover(force);
  if (tv.ch === 2) tvRenderNew(force);
  if (tv.ch === 3 && Date.now() - tv.queueAt > 20000) tvLoadQueue();
  if (!t && (tv.ch === 1 || tv.ch === 4)) { T.art.classList.remove("has"); tvNoSignal(tv.ch === 1 ? T.now : T.cover, "NO SIGNAL"); }
}

function el(tag, cls, text) {

function tvNoSignal(box, label) {

function hms(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 3600) + ":" + String(Math.floor(s / 60) % 60).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function tvRenderQueue() {
  const box = T.queue;
  const head = el("div", "tt-head");
  const now = new Date();
  head.append(el("b", "", "P333"), el("span", "", "GROOVTEXT"), el("span", "", now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false })));
  const title = el("div", "tt-title", "UP NEXT");
  const list = el("div", "tt-list");
  if (!tv.queue) list.append(el("div", "tt-empty", "PAGE NOT FOUND — couldn't read the queue"));
  else if (!tv.queue.length) list.append(el("div", "tt-empty", "NOTHING QUEUED"));
  else tv.queue.forEach((item, i) => {
    const row = el("button", "tt-row");
    row.type = "button";
    const name = el("span");
    const by = (item.artists || []).map((a) => a.name).join(", ") || (item.show && item.show.name) || "";
    name.append(item.name + " ", el("em", "", by));
    row.append(el("i", "", String(i + 1)), name);
    row.title = "Play " + item.name + " now";
    row.onclick = () => tvJump(i, item);
    list.append(row);
  });
  const fast = el("div", "fastext");
  [["PREV", "prev"], ["PLAY", "play"], ["NEXT", "next"], ["REFRESH", "refresh"]].forEach(([label, act]) => {
    const b = el("button", "", label);
    b.type = "button";
    b.onclick = () => (act === "refresh" ? tvLoadQueue() : tvAction(act));
    fast.append(b);
  });
  box.dataset.view = "queue";
  box.replaceChildren(head, title, list, fast);
}

async function tvJump(i, item) {
  tvStatic(500);
  tvOsd("▶▶ " + (i + 1));
  const ctx = state.context;
  let res = null;
  // jump straight there when the song is part of what's playing; otherwise skip ahead one by one
  if (ctx && !/:artist:/.test(ctx)) { try { res = await playerCall("play", { context_uri: ctx, offset: { uri: item.uri } }); } catch {} }
  if (!res || !res.ok) {
    for (let k = 0; k <= i; k++) {
      try { res = await api("https://api.spotify.com/v1/me/player/next", { method: "POST" }); } catch { res = null; }
      if (!res || !res.ok) break;
      await wait(350);
    }
  }
  if (res && !res.ok) tvOsd(res.status === 403 ? "PREMIUM ONLY" : "ERR " + res.status);
  setTimeout(pollSpotify, 600);
  setTimeout(tvLoadQueue, 1200);
}

async function tvAction(act) {
  if (act === "play") { toggleVinyl(); tvOsd(els.stage.classList.contains("playing") ? "▶" : "❚❚"); return; }
  if (act === "fx") {
    tv.fx = !tv.fx;
    try { localStorage.setItem("gtt_tv_fx", tv.fx ? "1" : "0"); } catch {}
    T.box.classList.toggle("strong", tv.fx);
    T.box.querySelector('[data-tv="fx"]').setAttribute("aria-pressed", String(tv.fx));
    tvOsd(tv.fx ? "FX STRONG" : "FX SOFT");
    return;
  }
  if (act === "power") { closeTV(); return; }
  if (act === "pip") { vpipEnter(); return; }
  const path = act === "prev" ? "previous" : "next";
  tvOsd(act === "prev" ? "⏮" : "⏭");
  let res = null;
  try { res = await api("https://api.spotify.com/v1/me/player/" + path, { method: "POST" }); } catch {}
  if (!res || !res.ok) { tvOsd(!res ? "NO SIGNAL" : res.status === 403 ? "PREMIUM ONLY" : res.status === 404 ? "NO PLAYER" : "ERR " + res.status); return; }
  setTimeout(pollSpotify, 500);
}

function tvKeys(e) {
  if (!tv.open || e.target.closest && e.target.closest("input")) return;
  if (["1", "2", "3", "4"].includes(e.key)) tvSetChannel(Number(e.key));
  else if (e.key === " ") { e.preventDefault(); tvAction("play"); }
  else if (e.key === "ArrowRight") tvAction("next");
  else if (e.key === "ArrowLeft") tvAction("prev");
  else if (e.key === "Escape") closeTV();
}

T.box.querySelectorAll(".tv-btn[data-ch]").forEach((b) => { b.onclick = () => tvSetChannel(Number(b.dataset.ch)); });
T.box.querySelectorAll("[data-tv]").forEach((b) => { b.onclick = () => tvAction(b.dataset.tv); });
T.layer.addEventListener("click", (e) => { if (e.target.id === "tvLayer") closeTV(); });
document.addEventListener("keydown", tvKeys);
addEventListener("resize", () => { if (tv.open && !tv.pip) tvScanlines(); });
$("tvBtn").onclick = openTV;

// ---------- the TV as a video, for picture-in-picture where there's no Document PiP (iPhone, Safari) ----------
// The whole set is drawn on a canvas and streamed into a <video>; video PiP floats over other apps on iOS.
// It's a picture, so its only controls are the system's: play/pause and ⏮ ⏭ are wired to Spotify.
const vpip = { canvas: null, ctx: null, video: null, timer: 0, imgs: new Map(), active: false, snow: 0, key: null };
const VW = 640, VH = 560;

function videoPipSupported() {
  const v = document.createElement("video");
  const canStream = typeof HTMLCanvasElement.prototype.captureStream === "function";
  const pip = document.pictureInPictureEnabled || (typeof v.webkitSupportsPresentationMode === "function" && v.webkitSupportsPresentationMode("picture-in-picture"));
  return canStream && !!pip;
}

function vpipImage(url) {
  if (!url) return null;
  if (!vpip.imgs.has(url)) {
    const img = new Image();
    img.crossOrigin = "anonymous"; // a cover from another origin would otherwise taint the canvas and blank the stream
    img.src = url;
    vpip.imgs.set(url, img);
    if (vpip.imgs.size > 12) vpip.imgs.delete(vpip.imgs.keys().next().value);
  }
  const img = vpip.imgs.get(url);
  return img.complete && img.naturalWidth ? img : null;
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function vpipText(ctx, text, x, y, size, color, maxW, lines = 1) {
  ctx.font = size + "px VT323, ui-monospace, Menlo, monospace";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = size * 0.25;
  const words = String(text || "").split(" ");
  let line = "", n = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      if (n === lines - 1) { line += "…"; break; }
      ctx.fillText(line, x, y + n * size * 1.02);
      n++;
      line = words[i];
    } else line = test;
  }
  while (ctx.measureText(line).width > maxW && line.length > 1) line = line.slice(0, -2) + "…";
  ctx.fillText(line, x, y + n * size * 1.02);
  ctx.shadowBlur = 0;
}

function drawTvFrame() {
  const ctx = vpip.ctx;
  if (!ctx) return;
  const t = state.track;
  if (state.trackKey !== vpip.key) { if (vpip.key !== null) vpip.snow = 4; vpip.key = state.trackKey; vpipMeta(); }
  ctx.fillStyle = "#0c090b";
  ctx.fillRect(0, 0, VW, VH);
  // cabinet, feet, bezel
  ctx.fillStyle = "#141317";
  ctx.fillRect(120, 528, 90, 16);
  ctx.fillRect(430, 528, 90, 16);
  const cab = ctx.createLinearGradient(0, 12, 0, 532);
  cab.addColorStop(0, "#55525c"); cab.addColorStop(0.06, "#34323a"); cab.addColorStop(0.55, "#29272e"); cab.addColorStop(1, "#1e1d22");
  ctx.fillStyle = cab; rrect(ctx, 16, 12, 608, 520, 34); ctx.fill();
  ctx.fillStyle = "#121114"; rrect(ctx, 40, 36, 560, 440, 26); ctx.fill();
  // the screen
  const S = { x: 58, y: 52, w: 524, h: 393 };
  ctx.save();
  rrect(ctx, S.x, S.y, S.w, S.h, 44); ctx.clip();
  const cols = state.colors && state.colors.key === state.trackKey ? state.colors.colors : null;
  const bg = ctx.createRadialGradient(S.x + S.w / 2, S.y + S.h * 0.45, 10, S.x + S.w / 2, S.y + S.h / 2, S.w * 0.7);
  bg.addColorStop(0, cols ? cols[0] + "55" : "#1a3027"); bg.addColorStop(0.7, "#0d1a14"); bg.addColorStop(1, "#070e0b");
  ctx.fillStyle = bg; ctx.fillRect(S.x, S.y, S.w, S.h);
  if (tv.fx) ctx.globalAlpha = 0.93 + Math.random() * 0.07;
  if (!t) {
    const bars = ["#c0c0c0", "#c0c000", "#00c0c0", "#00c000", "#c000c0", "#c00000", "#0000c0"];
    bars.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(S.x + (S.w / 7) * i, S.y, S.w / 7 + 1, S.h * 0.8); });
    ctx.fillStyle = "#000"; ctx.fillRect(S.x + S.w / 2 - 110, S.y + S.h * 0.36, 220, 46);
    vpipText(ctx, "NO SIGNAL", S.x + S.w / 2 - 80, S.y + S.h * 0.36 + 34, 36, "#fff", 200);
  } else {
    const playing = els.stage.classList.contains("playing");
    vpipText(ctx, playing ? "▶ PLAY" : "❚❚ PAUSE", S.x + 34, S.y + 50, 30, "#ffffff", 200);
    vpipText(ctx, "SP", S.x + S.w - 66, S.y + 50, 30, "#ffffff", 60);
    const art = vpipImage(t.artUrl);
    const A = { x: S.x + 34, y: S.y + 78, s: 186 };
    if (art) {
      ctx.save(); rrect(ctx, A.x, A.y, A.s, A.s, 8); ctx.clip();
      ctx.drawImage(art, A.x, A.y, A.s, A.s);
      ctx.restore();
    } else { ctx.fillStyle = "#1a2a22"; rrect(ctx, A.x, A.y, A.s, A.s, 8); ctx.fill(); }
    const tx = A.x + A.s + 22, tw = S.x + S.w - 34 - tx;
    vpipText(ctx, t.song, tx, A.y + 46, 40, "#ffe95c", tw, 2);
    vpipText(ctx, t.artists.join(", "), tx, A.y + 132, 30, "#7ff6ff", tw);
    vpipText(ctx, t.album || "", tx, A.y + 168, 24, "#9fb7aa", tw);
    const next = tv.queue && tv.queue.find((q) => q.id !== state.trackKey); // the queue can lag a song behind
    if (next) vpipText(ctx, "NEXT ▸ " + next.name, S.x + 34, S.y + 312, 24, "#4dff86", S.w - 68);
    const at = Math.min(currentElapsed(), state.trackDuration || 0);
    vpipText(ctx, hms(at), S.x + 34, S.y + 356, 30, "#ffffff", 140);
    const bx = S.x + 170, bw = S.w - 34 - 170, blocks = 16, p = state.trackDuration ? at / state.trackDuration : 0;
    for (let i = 0; i < blocks; i++) {
      ctx.fillStyle = i < Math.round(p * blocks) ? "#4dff86" : "rgba(77, 255, 134, 0.22)";
      ctx.fillRect(bx + (bw / blocks) * i, S.y + 336, bw / blocks - 5, 20);
    }
  }
  ctx.globalAlpha = 1;
  // snow between songs
  if (vpip.snow > 0 && !reduceMotion.matches) {
    vpip.snow--;
    const n = ctx.createImageData(131, 98);
    for (let i = 0; i < n.data.length; i += 4) { const v = Math.random() * 255; n.data[i] = n.data[i + 1] = n.data[i + 2] = v; n.data[i + 3] = 230; }
    const tmp = vpipSnowCanvas(); tmp.getContext("2d").putImageData(n, 0, 0);
    ctx.imageSmoothingEnabled = false; ctx.drawImage(tmp, S.x, S.y, S.w, S.h); ctx.imageSmoothingEnabled = true;
  }
  // scanlines, vignette, glare
  ctx.fillStyle = tv.fx ? "rgba(0, 0, 0, 0.42)" : "rgba(0, 0, 0, 0.3)";
  for (let y = S.y; y < S.y + S.h; y += 4) ctx.fillRect(S.x, y + 2, S.w, 2);
  const vig = ctx.createRadialGradient(S.x + S.w / 2, S.y + S.h / 2, S.h * 0.35, S.x + S.w / 2, S.y + S.h / 2, S.w * 0.62);
  vig.addColorStop(0, "rgba(0,0,0,0)"); vig.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = vig; ctx.fillRect(S.x, S.y, S.w, S.h);
  const gl = ctx.createLinearGradient(S.x, S.y, S.x + S.w * 0.45, S.y + S.h * 0.55);
  gl.addColorStop(0, "rgba(255,255,255,0.12)"); gl.addColorStop(0.6, "rgba(255,255,255,0.03)"); gl.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gl; ctx.fillRect(S.x, S.y, S.w, S.h);
  ctx.restore();
  // badge and the control strip
  ctx.font = "800 13px -apple-system, Segoe UI, Arial, sans-serif";
  ctx.fillStyle = "#c9c4cf";
  const brand = "GROOVTRON";
  let bx0 = VW / 2 - 76;
  for (const ch of brand) { ctx.fillText(ch, bx0, 466); bx0 += 17; }
  ctx.fillStyle = "#121114";
  for (let i = 0; i < 12; i++) ctx.fillRect(52 + i * 10, 492, 5, 22);
  ["1", "2", "3", "4", "⏮", "⏯", "⏭", "FX"].forEach((label, i) => {
    const x = 196 + i * 42;
    const g = ctx.createLinearGradient(0, 490, 0, 516);
    g.addColorStop(0, "#4d4a54"); g.addColorStop(1, "#2a292f");
    ctx.fillStyle = "#111013"; rrect(ctx, x, 493, 34, 24, 5); ctx.fill();
    ctx.fillStyle = g; rrect(ctx, x, 490, 34, 24, 5); ctx.fill();
    ctx.fillStyle = String(tv.ch) === label ? "#ffc23d" : "#d8d3dc";
    ctx.font = "700 13px -apple-system, Segoe UI, Arial, sans-serif";
    ctx.fillText(label, x + 17 - ctx.measureText(label).width / 2, 507);
  });
  ctx.fillStyle = "#3dff7a"; ctx.shadowColor = "#3dff7a"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(546, 502, 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  const pw = ctx.createRadialGradient(584, 498, 2, 588, 502, 16);
  pw.addColorStop(0, "#5a5762"); pw.addColorStop(1, "#232227");
  ctx.fillStyle = pw; ctx.beginPath(); ctx.arc(588, 502, 15, 0, Math.PI * 2); ctx.fill();
  if (navigator.mediaSession) navigator.mediaSession.playbackState = t && els.stage.classList.contains("playing") ? "playing" : "paused";
}

function vpipSnowCanvas() {
  if (!vpip.snowCanvas) { vpip.snowCanvas = document.createElement("canvas"); vpip.snowCanvas.width = 131; vpip.snowCanvas.height = 98; }
  return vpip.snowCanvas;
}

// lock screen / PiP: the song and its cover, plus Spotify on the system play, pause, next and previous
function vpipMeta() {
  if (!navigator.mediaSession || !vpip.video) return;
  const t = state.track;
  try {
    navigator.mediaSession.metadata = t ? new MediaMetadata({
      title: t.song, artist: t.artists.join(", "), album: t.album || "",
      artwork: t.artUrl ? [{ src: t.artUrl, sizes: "640x640", type: "image/jpeg" }] : [],
    }) : null;
  } catch {}
}

function vpipActions(on) {
  if (!navigator.mediaSession) return;
  const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, on ? fn : null); } catch {} };
  set("play", () => { if (!els.stage.classList.contains("playing")) tvAction("play"); });
  set("pause", () => { if (els.stage.classList.contains("playing")) tvAction("play"); });
  set("nexttrack", () => tvAction("next"));
  set("previoustrack", () => tvAction("prev"));
}

// the stream is set up when the TV opens, so the PiP button can switch over within the tap itself
function vpipPrepare() {
  if (vpip.video || !videoPipSupported()) return;
  const c = document.createElement("canvas");
  c.width = VW; c.height = VH;
  vpip.canvas = c;
  vpip.ctx = c.getContext("2d");
  if (document.fonts && document.fonts.load) document.fonts.load("30px VT323").catch(() => {});
  drawTvFrame();
  const v = document.createElement("video");
  v.className = "tv-video";
  v.muted = true; v.playsInline = true; v.autoplay = true;
  v.setAttribute("playsinline", ""); v.setAttribute("muted", ""); v.setAttribute("autopictureinpicture", "");
  v.srcObject = c.captureStream(12);
  v.addEventListener("enterpictureinpicture", () => vpipOn(true));
  v.addEventListener("leavepictureinpicture", () => vpipOn(false));
  v.addEventListener("webkitpresentationmodechanged", () => vpipOn(v.webkitPresentationMode === "picture-in-picture"));
  // a pause/play from the PiP window itself goes to Spotify too
  v.addEventListener("pause", () => { if (vpip.active && els.stage.classList.contains("playing")) tvAction("play"); });
  v.addEventListener("play", () => { if (vpip.active && !els.stage.classList.contains("playing")) tvAction("play"); });
  T.layer.append(v);
  vpip.video = v;
  v.play().catch(() => {});
  vpip.timer = setInterval(drawTvFrame, 100);
}

function vpipOn(on) {
  vpip.active = on;
  vpipActions(on);
  if (on) vpipMeta();
  T.layer.classList.toggle("vpip", on);
  tvOsd(on ? "PIP ON" : "PIP OFF");
}

function vpipEnter() {
  const v = vpip.video;
  if (!v) { tvOsd("NO PIP HERE"); return; }
  if (vpip.active) { vpipExit(); return; }
  if (v.paused) v.play().catch(() => {});
  // straight from the tap: browsers only allow PiP during a user gesture
  if (document.pictureInPictureEnabled && v.requestPictureInPicture) {
    v.requestPictureInPicture().catch((e) => {
      if (typeof v.webkitSetPresentationMode === "function") v.webkitSetPresentationMode("picture-in-picture");
      else { console.error("[gtt] video pip", e); tvOsd("PIP BLOCKED"); }
    });
  } else if (typeof v.webkitSetPresentationMode === "function") v.webkitSetPresentationMode("picture-in-picture");
}

function vpipExit() {
  const v = vpip.video;
  if (!v) return;
  try {
    if (document.pictureInPictureElement === v) document.exitPictureInPicture();
    else if (v.webkitPresentationMode === "picture-in-picture") v.webkitSetPresentationMode("inline");
  } catch {}
}

function vpipStop() {
  vpipExit();
  vpipOn(false);
  clearInterval(vpip.timer);
  if (vpip.video) {
    const s = vpip.video.srcObject;
    if (s) s.getTracks().forEach((tr) => tr.stop());
    vpip.video.remove();
  }
  vpip.video = null; vpip.canvas = null; vpip.ctx = null; vpip.key = null;
  if (navigator.mediaSession) try { navigator.mediaSession.metadata = null; } catch {}
}


const params = new URL(location.href).searchParams;
const joinCode = params.get("join");
if (joinCode) startGuest(joinCode.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8), params.get("jam"));
else if (params.has("rooms")) {
  // browse without logging in to Spotify: joining a room doesn't need it
  state.mode = "lobby";
  els.app.classList.add("lobby");
  setConn("off", "not logged in — joining doesn't need Spotify");
  setStatus("pick a room to join");
  setLobbyOpen(true);
} else startSpotify();
renderNet();
</script>
