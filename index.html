    display: none; gap: 0.3125rem; padding: 0.5rem 0.625rem; border-radius: 0.875rem;

  .karaoke p { min-height: 1.15em; font-size: 0.75rem; font-weight: 600; color: var(--label3); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .karaoke p.now { font-size: 0.9375rem; font-weight: 800; color: var(--cream); white-space: normal; }
  .karaoke p.now.pop { animation: answer-in 280ms var(--ease-back); }
  .ly-plain {
    max-height: 5.5rem; overflow-y: auto; white-space: pre-line; font-size: 0.75rem; font-weight: 600; line-height: 1.45; color: var(--label2); padding: 0.25rem 0.5rem 0.75rem;
    -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent);
  }
  .ly-plain + .ly-note { margin-top: 0.25rem; }
  .vsrow { display: grid; grid-template-columns: 1fr auto 2rem; align-items: center; gap: 0.5rem; font-size: 0.8125rem; font-weight: 600; color: var(--label2); }
  .vsrow span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vsrow b { font-family: var(--groovy); font-weight: 400; text-align: right; }
  .vsrow.won { color: var(--mustard); }
  .vsrow.me span:first-child { color: var(--cream); }
  .chips { display: flex; gap: 0.25rem; }
  .chip { width: 1.25rem; height: 1.25rem; border-radius: 0.375rem; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 0.625rem; font-weight: 800; color: var(--ink); }
  .chip.ok { background: var(--ok); }

  #choiceList button.pick-sel:disabled { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {

  }
</style>
</head>
<body>
<div id="app">
  <div class="lava" aria-hidden="true"><i></i><i></i><i></i></div>
  <header>

    </div>
  </header>
  <div class="seg" role="group" aria-label="Guess style">

  <div id="net"><span id="netLed" class="led"></span><span id="netText"></span><button id="netInvite" hidden>Invite</button><button id="roomsBtn" aria-pressed="false" title="Public rooms — find a game to join">🌍 Find</button><button id="netBtn">Host</button></div>
  <div id="jam">
    <input id="jamLink" type="url" placeholder="Paste your Spotify Jam link so everyone hears it" aria-label="Spotify Jam link" autocomplete="off" />
    <a id="jamJoin" target="_blank" rel="noopener noreferrer"></a>
    <span id="jamHint"></span>
    <button id="pubBtn" type="button" aria-pressed="false">🌍 List this room publicly</button>
    <span id="pubHint"></span>
  </div>
  <div id="lobby" aria-live="polite">
    <div class="lobby-head"><span>Public rooms</span><button id="lobbyRefresh" type="button">Refresh</button><button id="lobbyClose" type="button" aria-label="Close public rooms">✕</button></div>

</div>
<script>
const CONFIG = {
  spotifyClientId: "fb91c824fe804c50a8b4b244288ebc6f",
  redirectUri: location.origin + location.pathname,
  scopes: "user-read-currently-playing user-read-playback-state user-modify-playback-state",
  pollMs: 5000,
};

// optional: a Firebase project for the public lobby (a live room list in the Realtime Database).
// left blank, public rooms use the PeerJS lobby slots instead. Setup: FIREBASE.md
const FIREBASE = window.GTT_FIREBASE || {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  appId: "",
};
const useFirebase = !!(FIREBASE.apiKey && FIREBASE.databaseURL);

const state = {
  mode: "idle",
  imode: "type", choicesFailed: false,
  choice: { stage: 0, opts: null, accepted: null, results: [], picks: [] },
  track: null,
  trackKey: null,
  revealed: false,
  rounds: 0, points: 0, streak: 0,
  token: null, lastPoll: 0, userName: null,
  pos: null, trackDuration: 0,
  paid: [false, false, false], // pick mode: stages already paid out this song
  colors: null,                // { key, colors } of the current song's label
  lyrics: null,                // { key, status, synced, plain } from lrclib.net
  hint: null,                  // the lyric hint bought for this song
};

// versus: two players taking turns on one device, or a whole room online; one round per song
const vs = {
  on: false,
  players: localPlayers(), // { name, points, wins, away } — index = seat
  next: 0,                 // same device: who guesses first on the next song (alternates)
  turn: 0,
  guesses: [],             // by seat: { marks: [artist, song, year], earned } once locked in
};

// online versus: the host (Spotify logged in) is seat 0 and grades everything; guests
// (seat 1 and up, one per person in the Jam) never see the answer before the round resolves
const MAX_PLAYERS = 32; // a Spotify Jam holds 32 people
const net = {
  role: null,        // null | "host" | "guest"
  peer: null, code: null,
  conn: null,        // guest: the link to the host
  conns: [],         // host: guest links by seat (seat 0, the host, is always null)
  seatOf: new Map(), // host: device id -> seat, so a reload takes the seat back
  seat: null,        // guest: my seat, once the host says hello
  myName: "",        // guest: my name — mine to type, the host only echoes it
  myLocked: false,   // guest: locked in this round
  lastResult: null,  // host: last result message, resent to a guest who rejoins
  jam: "",           // the host's Spotify Jam invite, so guests can hear the music
};

// public rooms (see the lobby section at the bottom)
const LOBBY_SLOTS = 16;
const lobbyId = (i) => "gtt-lobby-v1-" + i;
const pub = { on: false, listed: false, peer: null, slot: -1, fb: null };
const lobby = { open: false, peer: null, rooms: new Map(), scanning: false, error: "", unwatch: null };

function storedNames() {
  try { const n = JSON.parse(localStorage.getItem("gtt_players") || "[]"); return Array.isArray(n) ? n : []; } catch { return []; }
}

function localPlayers() {
  const names = storedNames();
  return [0, 1].map((i) => ({ name: typeof names[i] === "string" ? names[i] : "", points: 0, wins: 0 }));
}

const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

window.addEventListener("error", (e) => {
  console.error("[gtt] JS error:", e.message, "at", e.filename + ":" + e.lineno);
  const s = $("status"); if (s) s.textContent = "error: " + e.message;
});
window.addEventListener("unhandledrejection", (e) => {
  console.error("[gtt] unhandled promise:", e.reason);
  const s = $("status"); if (s) s.textContent = "error: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
console.log("[gtt] script loaded, protocol:", location.protocol);
const els = {
  app: $("app"), stage: $("stage"), cover: $("cover"), coverBack: $("coverBack"), discLabel: $("discLabel"),
  progress: $("progress"), tNow: $("tNow"), tTotal: $("tTotal"),
  status: $("status"), answer: $("answer"),
  artist: $("gArtist"), song: $("gSong"), year: $("gYear"),
  fArtist: $("fArtist"), fSong: $("fSong"), fYear: $("fYear"),
  sPoints: $("sPoints"), sStreak: $("sStreak"), sRounds: $("sRounds"),
  stPoints: $("stPoints"), stStreak: $("stStreak"),
  check: $("check"), reveal: $("reveal"), skip: $("skip"),
  pipBtn: $("pipBtn"), vsBtn: $("vsBtn"), vsResult: $("vsResult"), lyrBtn: $("lyrBtn"), lyrics: $("lyrics"),
  vsScore: $("vsScore"), songsRow: $("stSongs"), sWins: $("sWins"), rows: [], // rows: { stat, name, pts } by seat
  imodes: document.querySelectorAll("[data-imode]"),
  choiceLabel: $("choiceLabel"), choiceList: $("choiceList"),
  led: $("led"), connText: $("connText"), reconnect: $("reconnect"),
  jam: $("jam"), jamLink: $("jamLink"), jamJoin: $("jamJoin"), jamHint: $("jamHint"), pubBtn: $("pubBtn"), pubHint: $("pubHint"),
  roomsBtn: $("roomsBtn"), lobby: $("lobby"), lobbyList: $("lobbyList"), lobbyNote: $("lobbyNote"),
  lobbyRefresh: $("lobbyRefresh"), lobbyClose: $("lobbyClose"), lobbyLogin: $("lobbyLogin"),
  net: $("net"), netLed: $("netLed"), netText: $("netText"), netInvite: $("netInvite"), netBtn: $("netBtn"),
};
const fields = [els.fArtist, els.fSong, els.fYear];

function setConn(cls, text) {
  els.led.className = "led " + cls;
  if (text) els.connText.textContent = text;
}

function setPlaying(on) {
  els.stage.classList.toggle("playing", on);
}

function setStatus(text, win) {
  els.status.textContent = text;
  els.status.classList.toggle("win", !!win);
}

setInterval(() => {
  if (state.mode !== "spotify" || !state.lastPoll) return;
  const age = Math.round((Date.now() - state.lastPoll) / 1000);
  if (age > 15) setConn("off", "stale · " + age + "s");
  else setConn("on", (state.userName ? "live: " + state.userName : "live") + " · " + age + "s");
}, 1000);

function normalize(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "")
    .replace(/\(.*?\)/g, " ").replace(/\bfeat\.?\b.*$/, " ")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}

function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[a.length][b.length];
}

function fuzzyMatch(guess, answers) {
  const g = normalize(guess);
  if (!g) return false;
  return answers.some((ans) => {
    const a = normalize(ans);
    if (g === a) return true;
    const d = levenshtein(g, a);
    return d / Math.max(g.length, a.length) <= 0.2;
  });
}

function setVerdict(field, verdict) {
  field.classList.remove("ok", "close", "bad");
  if (verdict) field.classList.add(verdict);
  field.querySelector("input").readOnly = verdict === "ok";
}

function shake(el) {
  if (reduceMotion.matches) return;
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
  el.addEventListener("animationend", () => el.classList.remove("shake"), { once: true });
}

function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function setProgress(elapsed, total) {
  const p = total ? Math.min(1, Math.max(0, elapsed / total)) : 0;
  els.progress.style.transform = "scaleX(" + p.toFixed(4) + ")";
  els.tNow.textContent = fmt(Math.min(elapsed, total));
  els.tTotal.textContent = fmt(total);
}

function updateScore() {
  els.sPoints.textContent = state.points;
  els.sStreak.textContent = state.streak >= 3 ? "🔥" + state.streak : state.streak;
  els.sRounds.textContent = state.rounds;
  els.stStreak.classList.toggle("hot", state.streak >= 3);
  renderPlayers();
}

// versus scoreboard, one row per seat; rows are reused so a name being typed keeps focus
function renderPlayers() {
  const n = vs.players.length;
  while (els.rows.length < n) els.rows.push(makePlayerRow(els.rows.length));
  while (els.rows.length > n) els.rows.pop().stat.remove();
  els.rows.forEach((r, i) => {
    const p = vs.players[i];
    r.name.readOnly = !(net.role ? i === myIndex() : true);
    if (r.name.value !== p.name && r.name.ownerDocument.activeElement !== r.name) r.name.value = p.name;
    r.pts.textContent = p.points;
    r.stat.classList.toggle("away", !!p.away);
    r.stat.classList.toggle("me", !!net.role && i === myIndex());
  });
  // head to head keeps the songs tally; a bigger room just ranks by points
  if (n === 2) { els.sWins.textContent = vs.players[0].wins + "–" + vs.players[1].wins; els.vsScore.append(els.songsRow); }
  else els.songsRow.remove();
  els.vsScore.classList.toggle("many", n > 3);
}

function makePlayerRow(i) {
  const stat = document.createElement("div");
  stat.className = "stat";
  const name = document.createElement("input");
  name.className = "pname"; name.maxLength = 12; name.autocomplete = "off";
  name.placeholder = "Player " + (i + 1);
  name.setAttribute("aria-label", "Player " + (i + 1) + " name");
  name.addEventListener("input", () => { if (!name.readOnly) setName(i, name.value); });
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); name.blur(); } });
  const pts = document.createElement("b");
  stat.append(name, pts);
  els.vsScore.append(stat);
  return { stat, name, pts };
}

function setName(i, name) {
  vs.players[i].name = name;
  // a guest's own name lives in slot 1, where it's always been
  const slot = net.role === "guest" ? 1 : i;
  try {
    const names = storedNames();
    names[slot] = name;
    localStorage.setItem("gtt_players", JSON.stringify(names));
  } catch {}
  if (net.role === "guest") { net.myName = name; netSend({ t: "name", name }); }
  else if (net.role === "host") netSend({ t: "players", players: vs.players });
  renderJam();
}

function statOf(i) {
  return els.rows[i] ? els.rows[i].stat : els.stPoints;
}

function popPoints(n, statEl = els.stPoints) {
  if (reduceMotion.matches) return;
  const el = document.createElement("span");
  el.className = "plus" + (n < 0 ? " minus" : ""); el.textContent = n < 0 ? "−" + -n : "+" + n;
  el.addEventListener("animationend", () => el.remove());
  statEl.appendChild(el);
}

function burst() {
  if (reduceMotion.matches) return;
  const colors = ["var(--mustard)", "var(--orange)", "var(--pink)", "var(--ok)", "var(--cream)"];
  for (let i = 0; i < 16; i++) {
    const c = document.createElement("i");
    const a = (i / 16) * Math.PI * 2, r = 48 + Math.random() * 40;
    c.className = "confetti";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", (Math.cos(a) * r).toFixed(0) + "px");
    c.style.setProperty("--dy", (Math.sin(a) * r).toFixed(0) + "px");
    c.style.setProperty("--r", (Math.random() * 540 - 270).toFixed(0) + "deg");
    c.addEventListener("animationend", () => c.remove());
    els.stage.appendChild(c);
  }
}

// ---------- vinyl label: album colours while it plays, the cover once it's revealed
const labelCache = new Map();

function setLabelColors(cols) {
  const s = els.discLabel.style;
  if (cols) { s.setProperty("--lab1", cols[0]); s.setProperty("--lab2", cols[1]); }
  else { s.removeProperty("--lab1"); s.removeProperty("--lab2"); }
}

function setLabelArt(url) {
  els.discLabel.style.backgroundImage = url ? "url(" + JSON.stringify(url) + ")" : "";
}

// two dominant colours of the cover; null if the image can't be read (CORS, offline)
function albumColors(url) {
  if (!labelCache.has(url)) labelCache.set(url, new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => { try { resolve(dominantColors(img)); } catch { resolve(null); } };
    img.onerror = () => resolve(null);
    img.src = url;
  }));
  return labelCache.get(url);
}

function dominantColors(img) {
  const n = 32, cv = document.createElement("canvas");
  cv.width = cv.height = n;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, n, n);
  const px = ctx.getImageData(0, 0, n, n).data;
  const buckets = new Map();
  for (let i = 0; i < px.length; i += 4) {
    const k = (px[i] >> 5) << 6 | (px[i + 1] >> 5) << 3 | px[i + 2] >> 5;
    const b = buckets.get(k) || { n: 0, r: 0, g: 0, b: 0 };
    b.n++; b.r += px[i]; b.g += px[i + 1]; b.b += px[i + 2];
    buckets.set(k, b);
  }
  // favour colourful, mid-bright swatches over the black/white most covers are full of
  const cols = [...buckets.values()].map(({ n: c, r, g, b }) => {
    r /= c; g /= c; b /= c;
    const max = Math.max(r, g, b), sat = max ? (max - Math.min(r, g, b)) / max : 0;
    return { r, g, b, score: c * (0.25 + sat) * (max < 50 ? 0.3 : max > 235 && sat < 0.1 ? 0.5 : 1) };
  }).sort((a, b) => b.score - a.score);
  const dist = (a, b) => Math.hypot(a.r - b.r, a.g - b.g, a.b - b.b);
  const first = cols[0], second = cols.find((c) => dist(c, first) > 80) || first;
  const hex = (c) => "#" + [c.r, c.g, c.b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
  return [hex(first), hex(second)];
}

function colorLabel(track, key) {
  if (!track.artUrl) { state.colors = null; setLabelColors(null); return; }
  albumColors(track.artUrl).then((colors) => {
    if (state.trackKey !== key) return;
    state.colors = colors && { key, colors };
    setLabelColors(colors);
    if (colors && net.role === "host") netSend({ t: "colors", key, colors });
  });
}

function newRound(track, key, carry = "") {
  const timedOut = !vs.on ? "" : net.role === "guest" ? carry : vsTimeUp();
  state.track = track; state.trackKey = key; state.revealed = false; state.choicesFailed = false;
  state.paid = [false, false, false];
  state.hint = null;
  applyInputUI();
  setLabelArt(null);
  if (net.role !== "guest") colorLabel(track, key);
  els.artist.value = ""; els.song.value = ""; els.year.value = "";
  els.answer.style.display = "none"; els.answer.replaceChildren();
  els.answer.classList.remove("pop");
  els.vsResult.style.display = "none"; els.vsResult.classList.remove("pop");
  fields.forEach((f) => setVerdict(f, null));
  els.cover.classList.remove("flipped");
  els.stage.classList.add("live");
  setStatus("new track — guess!");
  if (!els.app.classList.contains("pick") && els.app.ownerDocument.hasFocus()) els.artist.focus();
  if (vs.on) {
    vs.guesses = []; net.myLocked = false;
    els.rows.forEach((r) => r.stat.classList.remove("locked"));
    if (net.role) vsOnlineUI(timedOut);
    else { vs.turn = vs.next; vs.next = 1 - vs.next; vsTurnUI(timedOut); }
  } else setTurnHighlight(-1);
  if (net.role === "host") netSend({ t: "round", key, carry: timedOut, players: vs.players });
  setupChoices(track);
  if (lyricsOn && track.song) loadLyrics(track, key); // early, for the hint
  renderLyrics();
}

// answer key: the last 5 songs, newest first, kept across reloads for practice
const FASIT_MAX = 5;
let fasit = [];
try { fasit = (JSON.parse(localStorage.getItem("gtt_fasit")) || []).slice(0, FASIT_MAX); } catch {}

function addFasit(note) {
  const t = state.track;
  fasit = fasit.filter((f) => f.key !== state.trackKey);
  fasit.unshift({ key: state.trackKey, artists: t.artists, song: t.song, year: t.third.answer, artUrl: t.artUrl || null, note: note || "" });
  fasit.length = Math.min(fasit.length, FASIT_MAX);
  try { localStorage.setItem("gtt_fasit", JSON.stringify(fasit)); } catch {}
}

function renderFasit() {
  const head = document.createElement("div");
  head.className = "fasit-head";
  head.textContent = "answer key · last " + fasit.length;
  const rows = fasit.map((f, i) => {
    const row = document.createElement("div");
    row.className = "fasit-row" + (i === 0 ? " now" : "");
    let art;
    if (f.artUrl) { art = document.createElement("img"); art.src = f.artUrl; art.alt = ""; }
    else { art = document.createElement("i"); art.textContent = (f.song.match(/\b\p{L}/gu) || ["♪"]).slice(0, 2).join("").toUpperCase(); }
    art.className = "fasit-art";
    const txt = document.createElement("div");
    txt.className = "fasit-txt";
    const song = document.createElement("b");
    song.textContent = f.song;
    const meta = document.createElement("span");
    meta.textContent = f.artists.join(", ") + " · " + f.year;
    txt.append(song, meta);
    const pts = document.createElement("span");
    pts.className = "fasit-pts" + (/\+[1-9]/.test(f.note) ? " won" : "");
    pts.textContent = f.note;
    row.append(art, txt, pts);
    return row;
  });
  els.answer.replaceChildren(head, ...rows);
}

function check() {
  if (!state.track || state.revealed) return;
  if (usingPick()) return;
  if (vs.on) { vsLockTyped(); return; }
  const t = state.track;
  const aOk = fuzzyMatch(els.artist.value, t.artists);
  const sOk = fuzzyMatch(els.song.value, [t.song]);
  let thirdOk = null, earned = 0;
  const yv = parseInt(els.year.value, 10);
  if (!isNaN(yv)) {
    const diff = Math.abs(yv - t.third.answer);
    if (diff === 0) { thirdOk = "ok"; earned += 2; }
    else if (diff <= 2) { thirdOk = "close"; earned += 1; }
    else thirdOk = "bad";
  }
  if (aOk) earned += 1;
  if (sOk) earned += 1;
  const thirdVerdict = thirdOk === null ? "bad" : thirdOk;
  setVerdict(els.fArtist, aOk ? "ok" : "bad");
  setVerdict(els.fSong, sOk ? "ok" : "bad");
  setVerdict(els.fYear, thirdVerdict);
  fields.filter((f) => f.classList.contains("bad")).forEach(shake);
  const thirdRight = !!thirdOk && thirdOk !== "bad";
  const complete = aOk && sOk && thirdRight;
  if (complete) {
    state.rounds += 1; state.points += earned;
    state.streak = state.streak + 1;
    finish(state.streak >= 3 ? `far out! ${state.streak} in a row` : "groovy! nailed it", true, "+" + earned);
    popPoints(earned);
    burst();
    return;
  }
  const right = [aOk, sOk, thirdRight].filter(Boolean).length;
  setStatus(right ? `${right}/3 right — fix the red ones` : "nope. try again or reveal");
  const firstBad = fields.find((f) => !f.classList.contains("ok"));
  if (firstBad) firstBad.querySelector("input").focus();
}

// note: what this song scored, shown in the answer key ("+3", "skipped", "2–1" head to head)
function finish(msg, win, note) {
  state.revealed = true;
  setStatus(msg, win);
  updateScore();
  addFasit(note);
  renderFasit();
  if (lyricsOn && (!state.lyrics || state.lyrics.key !== state.trackKey)) loadLyrics(state.track, state.trackKey);
  renderLyrics();
  els.answer.style.display = "flex";
  els.answer.classList.add("pop");
  fields.forEach((f) => { f.querySelector("input").readOnly = true; });
  for (const b of els.choiceList.querySelectorAll("button")) b.disabled = true;
  if (state.track.artUrl) {
    const img = document.createElement("img");
    img.src = state.track.artUrl;
    img.alt = "";
    els.coverBack.replaceChildren(img);
    setLabelArt(state.track.artUrl);
  } else {
    els.coverBack.textContent = (state.track.song.match(/\b\p{L}/gu) || ["♪"]).slice(0, 2).join("").toUpperCase();
  }
  els.cover.classList.add("flipped");
}

function reveal() {
  if (!state.track || state.revealed) return;
  if (vs.on) {
    if (vsMeLocked()) return;
    if (net.role === "guest") guestLock({ kind: "pass" });
    else vsLock(BAD3, "passed");
    return;
  }
  state.rounds += 1; state.streak = 0;
  finish("revealed — 0 points", false, "revealed");
}

let choiceSeq = 0;
const albumCache = new Map();

// pick mode: sequential multiple choice — artist, then song, then year
function usingPick() {
  return state.imode === "pick" && !state.choicesFailed;
}

function applyInputUI() {
  els.app.classList.toggle("pick", usingPick());
}

function setImode(imode) {
  if (state.imode === imode) return;
  state.imode = imode;
  state.choicesFailed = false;
  choiceSeq++;
  els.imodes.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.imode === imode)));
  els.artist.value = ""; els.song.value = ""; els.year.value = "";
  fields.forEach((f) => setVerdict(f, null));
  state.choice = { stage: 0, opts: null, accepted: null, results: [], picks: [] };
  els.choiceList.replaceChildren();
  els.choiceLabel.textContent = "";
  if (net.role === "host") { netSend({ t: "imode", imode }); fbSyncSoon(); }
  if (imode === "pick" && state.track && !state.revealed) { setupChoices(state.track); return; }
  applyInputUI();
  if (imode === "pick") setStatus("pick mode on — options come with the next track");
}

function setupChoices(track) {
  applyInputUI();
  state.choice = { stage: 0, opts: null, accepted: null, results: [], picks: [] };
  els.choiceList.replaceChildren();
  if (state.imode !== "pick" || !track || state.revealed) { els.choiceLabel.textContent = ""; return; }
  const seq = ++choiceSeq;
  els.choiceLabel.textContent = "loading choices…";
  if (net.role === "guest") return; // the host sends the options
  const ready = fetchSpotifyPools(track);
  ready.then((pools) => {
    if (seq !== choiceSeq || state.revealed || state.track !== track) return;
    buildChoices(pools, track);
  }).catch(() => { if (seq === choiceSeq) choicesFallback(); });
}

function choicesFallback() {
  state.choicesFailed = true;
  applyInputUI();
  if (net.role === "host") netSend({ t: "choices", key: state.trackKey, failed: true });
  setStatus("not enough to pick from — type it" + (vs.on && !net.role ? " · " + pname(vs.turn) + "'s turn" : ""));
  if (els.app.ownerDocument.hasFocus()) els.artist.focus();
}

async function fetchSpotifyPools(track) {
  const pools = { artists: [], songs: [], years: [] };
  const jobs = [];
  if (track.albumId) jobs.push((async () => {
    let items = albumCache.get(track.albumId);
    if (items === undefined) {
      try {
        const res = await api(`https://api.spotify.com/v1/albums/${track.albumId}/tracks?limit=50`);
        items = res.ok ? (await res.json()).items : null;
      } catch { items = null; }
      albumCache.set(track.albumId, items);
    }
    if (items) for (const it of items) {
      pools.songs.push(it.name);
      for (const a of it.artists || []) pools.artists.push(a.name);
    }
  })());
  jobs.push((async () => {
    try {
      const res = await api("https://api.spotify.com/v1/me/player/queue");
      if (res.ok) {
        const data = await res.json();
        for (const item of data.queue || []) {
          if (!item || !item.name) continue;
          pools.songs.push(item.name);
          for (const a of item.artists || []) pools.artists.push(a.name);
          if (item.album && item.album.release_date) {
            const y = parseInt(item.album.release_date.slice(0, 4), 10);
            if (y) pools.years.push(y);
          }
        }
      }
    } catch {}
  })());
  await Promise.all(jobs);
  return pools;
}

function shuffled(arr) {
  const r = arr.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

// accepted = answers that count as correct (first is the one shown as the right button)
function buildOptions(accepted, pool) {
  const seen = new Set(accepted.map((a) => normalize(String(a))));
  const opts = [String(accepted[0])];
  for (const cand of shuffled(pool)) {
    const s = String(cand);
    const n = normalize(s);
    if (!n || seen.has(n)) continue;
    seen.add(n);
    opts.push(s);
    if (opts.length >= 5) break;
  }
  return shuffled(opts);
}

function yearPool(answer, years) {
  const now = new Date().getFullYear();
  const out = years.filter((y) => y && y !== answer);
  for (const off of [1, -1, 2, -2, 3, -3, 5, -5, 7, -7, 10, -10, 14, -14]) {
    const y = answer + off;
    if (y >= 1950 && y <= now + 1) out.push(y);
  }
  return out;
}

function buildChoices(pools, track) {
  const accepted = [track.artists, [track.song], [String(track.third.answer)]];
  const opts = [
    buildOptions(track.artists, pools.artists),
    buildOptions([track.song], pools.songs),
    buildOptions(accepted[2], yearPool(track.third.answer, pools.years)),
  ];
  if (opts[0].length < 2 || opts[1].length < 2 || opts[2].length < 2) { choicesFallback(); return; }
  state.choice.accepted = accepted;
  state.choice.opts = opts;
  if (net.role === "host") netSend({ t: "choices", key: state.trackKey, opts });
  if (!vsMeLocked()) renderStage();
}

function renderStage() {
  const c = state.choice;
  if (!c.opts) return;
  els.choiceLabel.textContent = (c.stage + 1) + "/3 · " + ["artist", "song", "year"][c.stage];
  els.choiceList.replaceChildren();
  for (const opt of c.opts[c.stage]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = opt;
    b.onclick = () => pickOption(opt, b);
    els.choiceList.appendChild(b);
  }
  if (els.app.ownerDocument.hasFocus()) els.choiceList.firstChild.focus();
}

function pickOption(opt, btn) {
  const c = state.choice;
  if (!c.opts || state.revealed || c.results.length !== c.stage) return;
  const ok = !!c.accepted && c.accepted[c.stage].includes(opt); // guests don't get the answers
  c.results.push(ok);
  c.picks.push(opt);
  if (vs.on) {
    btn.classList.add("pick-sel");
    for (const b of els.choiceList.children) b.disabled = true;
    const stage = ++c.stage;
    setTimeout(() => {
      if (state.choice !== c || state.revealed || c.stage !== stage || vsMeLocked()) return;
      if (stage < 3) renderStage();
      else if (net.role === "guest") guestLock({ kind: "pick", picks: c.picks });
      else vsLock(c.results.map((r) => (r ? "ok" : "bad")));
    }, reduceMotion.matches ? 150 : 300);
    return;
  }
  btn.classList.add(ok ? "pick-ok" : "pick-bad");
  if (ok && !state.paid[c.stage]) {
    // paid once per stage per song, so flipping Type/Pick can't farm points
    const pts = STAGE_POINTS[c.stage];
    state.paid[c.stage] = true;
    state.points += pts;
    updateScore();
    popPoints(pts);
  }
  const answer = c.accepted[c.stage][0];
  for (const b of els.choiceList.children) {
    b.disabled = true;
    if (!ok && b.textContent === answer) b.classList.add("pick-right");
  }
  c.stage += 1;
  const wait = reduceMotion.matches ? 250 : ok ? 650 : 1500;
  setTimeout(() => {
    if (state.choice !== c || state.revealed) return;
    if (c.stage < 3) renderStage();
    else finishPick();
  }, wait);
}

function finishPick() {
  const results = state.choice.results;
  const right = results.filter(Boolean).length;
  const earned = markPoints(results.map((r) => (r ? "ok" : "bad")));
  state.rounds += 1;
  if (right === 3) {
    state.streak = state.streak + 1;
    finish(state.streak >= 3 ? `far out! ${state.streak} in a row` : "groovy! nailed it", true, "+" + earned);
    burst();
  } else {
    state.streak = 0;
    finish(`${right}/3 right · +${earned} — next one's yours`, false, earned ? "+" + earned : "0");
  }
  els.choiceLabel.textContent = "next track inbound…";
}

function pname(i) {
  return (vs.players[i] && vs.players[i].name.trim()) || "Player " + (i + 1);
}

const STAGE_POINTS = [1, 1, 2]; // artist, song, year

function markPoints(marks) {
  return marks.reduce((sum, m, i) => sum + (m === "ok" ? STAGE_POINTS[i] : m === "close" ? 1 : 0), 0);
}

function setTurnHighlight(i) {
  els.rows.forEach((r, j) => r.stat.classList.toggle("turn", j === i));
}

// online: this device's seat
function myIndex() {
  return net.role === "guest" ? (net.seat ?? -1) : 0;
}

// online: has this device's player already locked in this round?
function vsMeLocked() {
  return net.role === "guest" ? net.myLocked : net.role === "host" ? !!vs.guesses[0] : false;
}

// still in the room (online, a guest who left keeps their seat and points but isn't waited for)
function present(i) {
  return !!vs.players[i] && !vs.players[i].away;
}

// seats that guessed this song
function vsEntrants() {
  return vs.players.map((_, i) => i).filter((i) => vs.guesses[i]);
}

// seats still to lock in
function vsWaitingOn() {
  return vs.players.map((_, i) => i).filter((i) => present(i) && !vs.guesses[i]);
}

function nameList(seats) {
  return seats.length <= 2 ? seats.map(pname).join(" & ") : seats.length + " players";
}

// restart the current song under new rules, unless its answer is already out
function replayRound() {
  if (!state.track || state.revealed) return false;
  const t = state.track; state.track = null; newRound(t, state.trackKey);
  return true;
}

function setVersus(on) {
  if (!on && net.role === "host") stopHosting(true);
  vs.on = on;
  vs.players = localPlayers();
  vs.guesses = [];
  vs.next = 0;
  els.app.classList.toggle("vs", on);
  els.vsBtn.setAttribute("aria-pressed", String(on));
  updateScore();
  renderNet();
  if (replayRound()) return;
  setTurnHighlight(-1);
  setStatus(on ? "versus on — first song up next" : "solo mode");
}

// clear the board for whoever guesses now; the other player shouldn't see anything
function vsTurnUI(prefix) {
  els.artist.value = ""; els.song.value = ""; els.year.value = "";
  fields.forEach((f) => setVerdict(f, null));
  setTurnHighlight(vs.turn);
  setStatus((prefix ? prefix + " · " : "") + pname(vs.turn) + "'s turn — " + pname(1 - vs.turn) + ", eyes off");
  const c = state.choice;
  if (usingPick() && c.opts) { c.stage = 0; c.results = []; c.picks = []; renderStage(); }
  else if (!usingPick() && els.app.ownerDocument.hasFocus()) els.artist.focus();
}

// online: no turns, everyone guesses at the same time
function vsOnlineUI(prefix) {
  els.artist.value = ""; els.song.value = ""; els.year.value = "";
  fields.forEach((f) => setVerdict(f, null));
  setTurnHighlight(-1);
  const here = vs.players.filter((p, i) => present(i)).length;
  const go = net.role === "host" && here < 2 ? "waiting for friends — invite your Jam"
    : here === 2 ? "go — you're both guessing" : "go — everyone's guessing";
  setStatus((prefix ? prefix + " · " : "") + go);
  if (!usingPick() && els.app.ownerDocument.hasFocus()) els.artist.focus();
}

function gradeTyped(artist, song, year) {
  const t = state.track;
  const yv = parseInt(year, 10);
  const diff = isNaN(yv) ? Infinity : Math.abs(yv - t.third.answer);
  return [
    fuzzyMatch(artist, t.artists) ? "ok" : "bad",
    fuzzyMatch(song, [t.song]) ? "ok" : "bad",
    diff === 0 ? "ok" : diff <= 2 ? "close" : "bad",
  ];
}

function vsLockTyped() {
  if (vsMeLocked()) return;
  const a = els.artist.value, s = els.song.value, y = els.year.value;
  if (!a.trim() && !s.trim() && !y.trim()) {
    setStatus("type something — or Pass");
    return;
  }
  if (net.role === "guest") guestLock({ kind: "type", a, s, y });
  else vsLock(gradeTyped(a, s, y));
}

function vsLock(marks, verb = "locked in", who = net.role ? myIndex() : vs.turn) {
  vs.guesses[who] = { marks, earned: markPoints(marks) };
  statOf(who).classList.add("locked");
  if (!vsWaitingOn().length) { vsResolve(); return; }
  if (net.role) {
    netSend({ t: "locked", key: state.trackKey, who, verb });
    showLocked(who, verb);
    return;
  }
  vs.turn = 1 - who; vsTurnUI(pname(who) + " " + verb);
}

// host: someone left mid-song — if they were the last one we waited on, settle it
function vsMaybeResolve() {
  if (vs.on && state.track && !state.revealed && vsEntrants().length && !vsWaitingOn().length) vsResolve();
}

// online: someone's in, others are still guessing
function showLocked(who, verb) {
  vs.guesses[who] ||= { marks: null, earned: 0 }; // guests only learn that a seat is in, not what it guessed
  statOf(who).classList.add("locked");
  const left = vsWaitingOn();
  const waiting = left.length ? " — waiting for " + nameList(left) : "";
  if (who === myIndex()) {
    fields.forEach((f) => { f.querySelector("input").readOnly = true; });
    if (usingPick()) { els.choiceList.replaceChildren(); els.choiceLabel.textContent = verb; }
    setStatus(verb + waiting);
  } else if (!vsMeLocked()) setStatus(pname(who) + " " + verb + " — your move");
  else setStatus(pname(who) + " " + verb + waiting);
}

// bank everyone's points for this song; returns the winner's seat, or -1 for a tie / nobody scoring
function vsScoreSong() {
  vsEntrants().forEach((i) => { vs.players[i].points += vs.guesses[i].earned; });
  const w = vsWinner();
  if (w >= 0) vs.players[w].wins += 1;
  updateScore();
  return w;
}

function vsBest() {
  return Math.max(0, ...vsEntrants().map((i) => vs.guesses[i].earned));
}

function vsWinner() {
  const best = vsBest();
  const top = vsEntrants().filter((i) => vs.guesses[i].earned === best);
  return best > 0 && top.length === 1 ? top[0] : -1;
}

function vsResultText(w) {
  const seats = vsEntrants(), pts = seats.map((i) => vs.guesses[i].earned), best = vsBest();
  if (seats.length === 2) {
    const [a, b] = pts;
    return w < 0 ? `dead heat ${a}–${b}` : `${pname(w)} takes it ${Math.max(a, b)}–${Math.min(a, b)}`;
  }
  if (w >= 0) return seats.length === 1 ? `${pname(w)} scores ${best}` : `${pname(w)} takes it with ${best}`;
  if (best === 0) return "nobody scored";
  const top = seats.filter((i) => vs.guesses[i].earned === best);
  return top.length > 3 ? `${top.length}-way tie at ${best}` : `dead heat at ${best} — ` + top.map(pname).join(", ");
}

// answer key note: the score line head to head, otherwise how this device did
function vsNote(w) {
  const seats = vsEntrants();
  if (seats.length === 2) return seats.map((i) => vs.guesses[i].earned).join("–");
  const me = vs.guesses[myIndex()];
  if (!net.role || !me) return w >= 0 ? "👑 " + pname(w) : "tie";
  return (w === myIndex() ? "👑 " : "") + (me.earned ? "+" + me.earned : "0");
}

function vsResolve() {
  if (!net.role) { els.artist.value = ""; els.song.value = ""; els.year.value = ""; }
  const w = vsScoreSong();
  const msg = w < 0 ? vsResultText(w) : "far out — " + vsResultText(w);
  if (net.role === "host") {
    const t = state.track;
    net.lastResult = {
      t: "result", key: state.trackKey, w, msg, guesses: vs.players.map((_, i) => vs.guesses[i] || null), players: vs.players,
      track: { artists: t.artists, song: t.song, third: t.third, artUrl: t.artUrl, album: t.album, duration: t.duration },
    };
    netSend(net.lastResult);
  }
  vsShowResult(w, msg);
}

function vsShowResult(w, msg) {
  setTurnHighlight(-1);
  els.rows.forEach((r) => r.stat.classList.remove("locked"));
  finish(msg, w >= 0, vsNote(w));
  renderVsResult(w);
  vsEntrants().forEach((i) => { if (vs.guesses[i].earned) popPoints(vs.guesses[i].earned, statOf(i)); });
  if (w >= 0) burst();
  if (usingPick()) els.choiceLabel.textContent = "next track inbound…";
}

// the song changed before everyone locked in: whoever's still here and didn't scores 0
function vsTimeUp() {
  if (!state.track || state.revealed || !vsEntrants().length) return "";
  vsWaitingOn().forEach((i) => { vs.guesses[i] = { marks: BAD3, earned: 0 }; });
  return "time's up, " + vsResultText(vsScoreSong());
}

function renderVsResult(w) {
  let seats = vsEntrants();
  if (seats.length > 2) seats = seats.sort((a, b) => vs.guesses[b].earned - vs.guesses[a].earned);
  const rows = seats.map((i) => {
    const g = vs.guesses[i];
    const row = document.createElement("div");
    row.className = "vsrow" + (i === w ? " won" : "") + (net.role && i === myIndex() ? " me" : "");
    const name = document.createElement("span");
    name.textContent = (i === w ? "👑 " : "") + pname(i) + (net.role && i === myIndex() && seats.length > 2 ? " (you)" : "");
    const chips = document.createElement("span");
    chips.className = "chips";
    ["artist", "song", "year"].forEach((label, k) => {
      const c = document.createElement("i");
      c.className = "chip " + g.marks[k];
      c.textContent = label[0].toUpperCase();
      c.title = label;
      chips.appendChild(c);
    });
    const pts = document.createElement("b");
    pts.textContent = "+" + g.earned;
    row.append(name, chips, pts);
    return row;
  });
  els.vsResult.replaceChildren(...rows);

async function pollSpotify() {
  try {
    const res = await api("https://api.spotify.com/v1/me/player/currently-playing");
    if (res.status === 204) { setStatus("nothing playing — start a song in Spotify"); setPlaying(false); state.lastPoll = Date.now(); return; }
    if (!res.ok) {
      setConn("off", "error " + res.status);
      if (res.status === 401) setStatus("Spotify login expired — hit reconnect");
      return;
    }
    state.lastPoll = Date.now();
    const data = await res.json();
    if (!data || !data.item) { console.log("[gtt] poll ok, no item"); return; }
    console.log("[gtt] poll ok, item:", data.item.id, "playing:", !!data.is_playing);
    const item = data.item;
    const track = {
      artists: item.artists.map((a) => a.name),
      song: item.name,
      third: { label: "year", answer: parseInt((item.album.release_date || "0").slice(0, 4), 10) },
      artUrl: (item.album.images && item.album.images[0]) ? item.album.images[0].url : null,
      albumId: item.album ? item.album.id : null,
      album: item.album ? item.album.name : "",
      duration: item.duration_ms || 0,
    };
    const key = item.id;
    if (key !== state.trackKey) newRound(track, key);
    setPlaying(!!data.is_playing);
    state.trackDuration = item.duration_ms || 0;
    state.pos = { position_ms: data.progress_ms || 0, timestamp_ms: Date.now(), speed: data.is_playing ? 1 : 0 };
    netSendPos();
  } catch (e) {
    setStatus("connection glitch — retrying");
    setConn("off", "offline");
  }
}

function loadToken() {
  try {
    const raw = localStorage.getItem("pip_widget_auth");
    if (!raw) return false;
    const auth = JSON.parse(raw);
    if (auth.expiresAt && Date.now() > auth.expiresAt - 30000) return false;
    if (auth.scope === undefined) return false; // saved before Skip needed playback control
    state.token = auth.access;
    return true;
  } catch { return false; }
}

async function saveAuth(auth) {
  state.token = auth.access_token;
  let prev = {};
  try { prev = JSON.parse(localStorage.getItem("pip_widget_auth")) || {}; } catch {}
  localStorage.setItem("pip_widget_auth", JSON.stringify({
    scope: auth.scope || prev.scope || "",
    access: auth.access_token,
    refresh: auth.refresh_token || prev.refresh,
    expiresAt: Date.now() + (auth.expires_in || 3600) * 1000,
  }));
}

async function redirectToSpotify() {
  const verifier = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(64))))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  sessionStorage.setItem("pip_widget_verifier", verifier);
  const q = new URLSearchParams({
    client_id: CONFIG.spotifyClientId,
    response_type: "code",
    redirect_uri: CONFIG.redirectUri,
    scope: CONFIG.scopes,
    code_challenge_method: "S256",
    code_challenge: challenge,
  });
  location.href = "https://accounts.spotify.com/authorize?" + q.toString();
}

async function exchangeCode(code) {
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      grant_type: "authorization_code",
      code,
      redirect_uri: CONFIG.redirectUri,
      client_id: CONFIG.spotifyClientId,
      code_verifier: sessionStorage.getItem("pip_widget_verifier") || "",
    }),
  });
  if (res.ok) { await saveAuth(await res.json()); return true; }
  const body = await res.text();
  console.error("[gtt] token exchange failed:", res.status, body);
  setStatus("auth failed (" + res.status + ") — hit reconnect to retry");
  return false;
}

async function refreshAccessToken() {
  try {
    const raw = localStorage.getItem("pip_widget_auth");
    if (!raw) return false;
    const auth = JSON.parse(raw);
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "refresh_token",
        refresh_token: auth.refresh,
        client_id: CONFIG.spotifyClientId,
      }),
    });
    if (!res.ok) return false;
    await saveAuth(await res.json());
    return true;
  } catch { return false; }
}

// ---------- lyrics (opt-in, from lrclib.net): a hint while guessing, karaoke after the reveal
let lyricsOn = false;
try { lyricsOn = localStorage.getItem("gtt_lyrics") === "1"; } catch {}
const lyricsCache = new Map(); // track key -> Promise<lyrics | null>
let karaokeIdx = -2;

function setLyricsOn(on) {
  lyricsOn = on;
  try { localStorage.setItem("gtt_lyrics", on ? "1" : "0"); } catch {}
  els.lyrBtn.setAttribute("aria-pressed", String(on));

// "Song - Remastered 2011" / "Song (feat. X)" -> "Song", for the fuzzy fallback search
function plainTitle(song) {
  return song.replace(/\s+-\s+.*$/, "").replace(/\s*[([].*?[)\]]/g, "").trim() || song;
}

async function fetchLyrics(t) {
  const artist = t.artists[0] || "";
  const q = new URLSearchParams({ artist_name: artist, track_name: t.song });
  if (t.album) q.set("album_name", t.album);
  if (t.duration) q.set("duration", String(Math.round(t.duration / 1000)));
  const res = await fetch("https://lrclib.net/api/get?" + q);
  if (res.ok) return res.json();
  if (res.status !== 404) throw new Error("lrclib " + res.status);
  // exact match failed (remaster titles, slightly different durations): search, prefer synced + closest length
  const sr = await fetch("https://lrclib.net/api/search?" + new URLSearchParams({ artist_name: artist, track_name: plainTitle(t.song) }));
  if (!sr.ok) return null;
  const list = (await sr.json()) || [];
  const off = (r) => (t.duration ? Math.abs(r.duration * 1000 - t.duration) : 0);
  const ok = list.filter((r) => (r.syncedLyrics || r.plainLyrics || r.instrumental) && off(r) < 8000);
  ok.sort((a, b) => (!b.syncedLyrics - !a.syncedLyrics) || off(a) - off(b));
  return ok[0] || null;
}

function parseLrc(text) {
  const out = [];
  for (const raw of String(text || "").split(/\r?\n/)) {
    const stamps = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const words = raw.replace(/\[[^\]]*\]/g, "").trim();
    for (const m of stamps) out.push({ t: (Number(m[1]) * 60 + Number(m[2])) * 1000, text: words });
  }
  return out.sort((a, b) => a.t - b.t);
}

function loadLyrics(track, key) {
  state.lyrics = { key, status: "loading" };
  if (!lyricsCache.has(key)) lyricsCache.set(key, fetchLyrics(track).catch((e) => { console.error("[gtt] lyrics:", e); lyricsCache.delete(key); return null; }));
  lyricsCache.get(key).then((r) => {
    if (state.trackKey !== key || !state.lyrics || state.lyrics.key !== key) return;
    const synced = r && r.syncedLyrics ? parseLrc(r.syncedLyrics) : [];
    const plain = r && r.plainLyrics ? r.plainLyrics.split(/\r?\n/).map((l) => l.trim()) : synced.map((l) => l.text);
    state.lyrics = {
      key,
      status: !r ? "none" : r.instrumental ? "instrumental" : synced.length || plain.some(Boolean) ? "ok" : "none",
      synced: synced.length ? synced : null,
      plain,
    };
    karaokeIdx = -2;
    renderLyrics();
  });
}

// one early-ish line, title words blanked so the hint isn't the answer
function lyricHint(lines, song) {
  const title = normalize(song).split(" ").filter((w) => w.length >= 3);
  const hasTitle = (l) => normalize(l).split(" ").some((w) => title.includes(w));
  const usable = [...new Set(lines.filter((l) => l && l.split(/\s+/).length >= 4))];
  if (!usable.length) return null;
  const clean = usable.filter((l) => !hasTitle(l));
  const pool = clean.length ? clean : usable;
  const early = pool.slice(0, Math.max(1, Math.ceil(pool.length * 0.4)));
  const line = early[Math.floor(Math.random() * early.length)];
  return line.split(/(\s+)/).map((tok) => (title.includes(normalize(tok)) ? "___" : tok)).join("");
}

function useHint() {
  const ly = state.lyrics;
  if (state.revealed || vs.on || state.hint || !ly || ly.status !== "ok" || ly.key !== state.trackKey) return;
  const hint = lyricHint(ly.plain, state.track.song);
  if (!hint) { state.hint = "no usable line in these lyrics — no charge"; renderLyrics(); return; }
  state.hint = "“" + hint + "”";
  state.points -= 1;
  updateScore();
  popPoints(-1);
  renderLyrics();
}

function lyNote(text) {
  const n = document.createElement("div");
  n.className = "ly-note";
  n.textContent = text;
  return n;
}

function renderLyrics() {
  const ly = state.lyrics && state.lyrics.key === state.trackKey ? state.lyrics : null;
  let kids = [];
  if (lyricsOn && state.track && state.track.song) {
    if (!state.revealed) {
      // hint: solo only, versus would need a fair way to charge both players
      if (!vs.on && ly && ly.status === "ok") {
        if (state.hint) {
          const h = document.createElement("div");
          h.className = "ly-hint"; h.textContent = state.hint;
          kids = [h];
        } else {
          const b = document.createElement("button");
          b.id = "hintBtn"; b.type = "button"; b.textContent = "🎤 lyric hint · −1 point";
          b.onclick = useHint;
          kids = [b];
        }
      }
    } else if (!ly || ly.status === "loading") kids = [lyNote("finding lyrics…")];
    else if (ly.status === "none") kids = [lyNote("no lyrics on LRCLIB for this one")];
    else if (ly.status === "instrumental") kids = [lyNote("♪ instrumental ♪")];
    else if (ly.synced) {
      const k = document.createElement("div");
      k.className = "karaoke";
      k.append(...["prev", "now", "next"].map((c) => { const p = document.createElement("p"); p.className = c; return p; }));
      kids = [k];
      karaokeIdx = -2;
    } else {
      const p = document.createElement("div");
      p.className = "ly-plain"; p.textContent = ly.plain.join("\n");
      kids = [p, lyNote("not synced — LRCLIB only has the plain text")];
    }
  }
  els.lyrics.replaceChildren(...kids);
  els.lyrics.classList.toggle("show", kids.length > 0);
}

function syncKaraoke(elapsed) {
  const ly = state.lyrics;
  if (!state.revealed || !lyricsOn || !ly || !ly.synced || ly.key !== state.trackKey) return;
  const lines = ly.synced;
  let i = -1;
  while (i + 1 < lines.length && lines[i + 1].t <= elapsed + 200) i++; // a hair early reads better
  if (i === karaokeIdx) return;
  karaokeIdx = i;
  const ps = els.lyrics.querySelectorAll(".karaoke p");
  if (ps.length !== 3) return;
  const text = (j) => (j < 0 ? "" : j >= lines.length ? "" : lines[j].text || "♪");
  ps[0].textContent = text(i - 1);
  ps[1].textContent = i < 0 ? "♪" : text(i);
  ps[2].textContent = text(i + 1);
  ps[1].classList.remove("pop"); void ps[1].offsetWidth; ps[1].classList.add("pop");
}

// ---------- online play (PeerJS / WebRTC) ----------
const PEERJS_URL = "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";
let peerLib = null;
function loadPeerJs() {
  return peerLib ||= new Promise((resolve, reject) => {
    if (window.Peer) return resolve();
    const s = document.createElement("script");
    s.src = PEERJS_URL;
    s.onload = () => resolve();
    s.onerror = () => { peerLib = null; reject(new Error("couldn't load PeerJS")); };
    document.head.appendChild(s);
  });
}
const peerOptions = () => window.GTT_PEER_OPTIONS || {}; // override for a self-hosted PeerJS server

// guests still connected (host), or the link to the host (guest)
function netGuests() {
  return net.conns.filter((c) => c && c.open).length;
}

function netLinked() {
  return net.role === "guest" ? !!(net.conn && net.conn.open) : netGuests() > 0;
}

function sendTo(conn, msg) {
  if (conn && conn.open) conn.send(msg);
}

// guest: to the host · host: to every guest in the room
function netSend(msg) {
  if (net.role === "guest") sendTo(net.conn, msg);
  else if (net.role === "host") net.conns.forEach((c) => sendTo(c, msg));
}

function netSendPos(conn) {
  if (net.role !== "host" || !state.pos) return;
  const p = state.pos;
  const msg = { t: "pos", pos: p.position_ms + (Date.now() - p.timestamp_ms) * p.speed, dur: state.trackDuration, playing: !!p.speed };
  if (conn) sendTo(conn, msg); else netSend(msg);
}

function inviteUrl() {

// only pass along real Spotify links (open.spotify.com/socialsession/…, spotify.link/…)
function jamUrl(v) {
  try {
    const u = new URL(String(v || "").trim());
    return u.protocol === "https:" && /(^|\.)spotify\.(com|link)$|^spotify\.app\.link$/.test(u.hostname) ? u.href : "";
  } catch { return ""; }
}

function renderNet() {

    : "same device — or online";

function makeCode() {
  const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(5)), (b) => abc[b % abc.length]).join("");
}

async function startHosting() {
  if (net.role) return;
  net.role = "host";
  renderNet();
  try { await loadPeerJs(); } catch (e) { net.role = null; renderNet(); setStatus("online play unavailable — " + e.message); return; }
  if (net.role !== "host") return;
  net.code = makeCode();
  net.jam = jamUrl(els.jamLink.value);
  // a new room is a new game: the host on seat 0, everyone else pulls up a chair as they join
  net.conns = [null]; net.seatOf = new Map();
  vs.players = [{ name: localPlayers()[0].name, points: 0, wins: 0 }];
  vs.guesses = [];
  updateScore();
  const peer = new Peer("gtt-" + net.code, peerOptions());
  net.peer = peer;
  peer.on("open", () => { console.log("[gtt] hosting room", net.code); renderNet(); });
  peer.on("connection", (conn) => {
    conn.on("data", (msg) => { try { onHostData(conn, msg); } catch (e) { console.error("[gtt] bad message", e); } });
    conn.on("close", () => hostDrop(conn));
  });
  peer.on("disconnected", () => { if (net.peer === peer && !peer.destroyed) peer.reconnect(); });
  peer.on("error", (e) => {
    console.error("[gtt] peer error", e.type, e);
    if (net.peer !== peer) return;
    if (e.type === "unavailable-id") { stopHosting(true); startHosting(); return; }
    if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "browser-incompatible") {
      stopHosting(true); setStatus("couldn't open a room (" + e.type + ")");
    }
  });
  replayRound();
}

function stopHosting(quiet) {
  if (net.role !== "host") return;
  setPublic(false);
  netSend({ t: "bye" });
  const peer = net.peer;
  Object.assign(net, { role: null, peer: null, conns: [], seatOf: new Map(), code: null, lastResult: null, jam: "" });
  if (peer) setTimeout(() => peer.destroy(), 200);
  vs.players = localPlayers(); vs.guesses = [];
  updateScore();
  renderNet();
  if (!quiet) replayRound();
}

// a guest says hi (and again after every reload): give them a seat — their old one if they had one
function hostSeat(conn, msg) {
  const id = str(conn.metadata && conn.metadata.id, 40) || conn.peer;
  let seat = net.seatOf.get(id);
  if (seat === undefined) {
    if (vs.players.length >= MAX_PLAYERS) { sendTo(conn, { t: "full" }); setTimeout(() => conn.close(), 500); return; }
    seat = vs.players.push({ name: "", points: 0, wins: 0 }) - 1;
    net.seatOf.set(id, seat);
  }
  const old = net.conns[seat];
  net.conns[seat] = conn;
  if (old && old !== conn) old.close();
  const fresh = vs.players[seat].away !== false;
  vs.players[seat].name = str(msg.name, 12);
  vs.players[seat].away = false;
  netSync(conn, seat);
  netSend({ t: "players", players: vs.players });
  updateScore(); renderNet();
  if (fresh) setStatus(pname(seat) + " joined" + (state.track && !state.revealed && !vsMeLocked() ? " — go" : ""));
}

// a guest's link dropped: keep their seat and points for a rejoin, stop waiting on them
function hostDrop(conn) {
  const seat = net.conns.indexOf(conn);
  if (seat < 1) return;
  net.conns[seat] = null;
  vs.players[seat].away = true;
  netSend({ t: "players", players: vs.players });
  updateScore(); renderNet();
  setStatus(pname(seat) + " left — the invite still works");
  vsMaybeResolve();
}

// bring a (re)joining guest up to date
function netSync(conn, seat) {
  const send = (msg) => sendTo(conn, msg);
  send({ t: "hello", seat, players: vs.players, imode: state.imode, jam: net.jam });
  if (!state.track) return;
  const key = state.trackKey;
  if (state.revealed) {
    if (net.lastResult && net.lastResult.key === key) send(net.lastResult);
    return;
  }
  send({ t: "round", key, carry: "", players: vs.players });
  if (state.imode === "pick") {
    if (state.choicesFailed) send({ t: "choices", key, failed: true });
    else if (state.choice.opts) send({ t: "choices", key, opts: state.choice.opts });
  }
  vs.guesses.forEach((g, who) => { if (g) send({ t: "locked", key, who, verb: "locked in" }); });
  if (state.colors && state.colors.key === key) send({ t: "colors", key, colors: state.colors.colors });
  netSendPos(conn);
}

const BAD3 = ["bad", "bad", "bad"];
const str = (v, max = 200) => String(v == null ? "" : v).slice(0, max);

function onHostData(conn, msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.t === "sync") { hostSeat(conn, msg); return; }
  const seat = net.conns.indexOf(conn);
  if (seat < 1) return;
  if (msg.t === "bye") { conn.close(); return; }
  if (msg.t === "name") {
    vs.players[seat].name = str(msg.name, 12);
    netSend({ t: "players", players: vs.players });
    updateScore(); renderNet();
    return;
  }
  if (msg.t !== "guess" || msg.key !== state.trackKey || !state.track || state.revealed || vs.guesses[seat]) return;
  let marks = BAD3;
  if (msg.kind === "type") marks = gradeTyped(str(msg.a), str(msg.s), str(msg.y, 8));
  else if (msg.kind === "pick" && state.choice.accepted && Array.isArray(msg.picks)) {
    marks = state.choice.accepted.map((acc, i) => (acc.includes(str(msg.picks[i])) ? "ok" : "bad"));
  }
  vsLock(marks, msg.kind === "pass" ? "passed" : "locked in", seat);
}

function guestLock(guess) {
  net.myLocked = true;
  netSend({ t: "guess", key: state.trackKey, ...guess });
  showLocked(net.seat, guess.kind === "pass" ? "passed" : "locked in");
}

// guest: the host's roster is the truth, except for my own name
function setPlayers(players) {
  if (!Array.isArray(players) || !players.length) return;
  vs.players = players.slice(0, MAX_PLAYERS).map((p, i) => ({
    name: i === net.seat ? net.myName : str(p && p.name, 12),
    points: Number(p && p.points) || 0,
    wins: Number(p && p.wins) || 0,
    away: !!(p && p.away),
  }));
  updateScore();
}

function seatOk(v) {
  return Number.isInteger(v) && v >= 0 && v < vs.players.length;
}

function cleanTrack(t) {
  t = t || {};
  const art = str(t.artUrl, 500);
  return {
    artists: Array.isArray(t.artists) ? t.artists.map((a) => str(a)) : [],
    song: str(t.song),
    third: { label: "year", answer: Number(t.third && t.third.answer) || 0 },
    artUrl: art.startsWith("https://") ? art : null,
    album: str(t.album),
    duration: Number(t.duration) || 0,
  };
}

function onGuestData(msg) {
  if (!msg || typeof msg !== "object") return;
  switch (msg.t) {
    case "hello":
      if (!Number.isInteger(msg.seat) || msg.seat < 1 || msg.seat >= MAX_PLAYERS) break;
      net.synced = true;
      net.seat = msg.seat;
      if (jamUrl(msg.jam)) net.jam = jamUrl(msg.jam);
      setPlayers(msg.players);
      if (msg.imode === "type" || msg.imode === "pick") setImode(msg.imode);
      renderNet();
      break;
    case "players":
      setPlayers(msg.players);
      renderNet();
      break;
    case "jam":
      net.jam = jamUrl(msg.url);
      renderJam();
      break;
    case "imode":
      if (msg.imode === "type" || msg.imode === "pick") setImode(msg.imode);
      break;
    case "round":
      setPlayers(msg.players);
      newRound({ pending: true }, str(msg.key), str(msg.carry));
      break;
    case "choices":
      if (msg.key !== state.trackKey || state.revealed) break;
      if (msg.failed || !Array.isArray(msg.opts)) { state.choicesFailed = true; applyInputUI(); break; }
      state.choice = { stage: 0, opts: msg.opts.slice(0, 3).map((o) => (Array.isArray(o) ? o.slice(0, 5).map((x) => str(x)) : [])), accepted: null, results: [], picks: [] };
      applyInputUI();
      if (!net.myLocked) renderStage();
      break;
    case "locked":
      if (msg.key !== state.trackKey || state.revealed || !seatOk(msg.who)) break;
      if (msg.who === net.seat) net.myLocked = true;
      showLocked(msg.who, msg.verb === "passed" ? "passed" : "locked in");
      break;
    case "colors":
      if (msg.key !== state.trackKey || !Array.isArray(msg.colors)) break;
      if (msg.colors.length === 2 && msg.colors.every((c) => /^#[0-9a-f]{6}$/i.test(c))) setLabelColors(msg.colors);
      break;
    case "pos":
      state.trackDuration = Number(msg.dur) || 0;
      state.pos = { position_ms: Number(msg.pos) || 0, timestamp_ms: Date.now(), speed: msg.playing ? 1 : 0 };
      setPlaying(!!msg.playing);
      break;
    case "result": {
      if (msg.key !== state.trackKey || state.revealed) break;
      state.track = cleanTrack(msg.track);
      setPlayers(msg.players);
      vs.guesses = [];
      (Array.isArray(msg.guesses) ? msg.guesses : []).slice(0, vs.players.length).forEach((g, i) => {
        if (!g || typeof g !== "object") return;
        vs.guesses[i] = { marks: [0, 1, 2].map((k) => (["ok", "close", "bad"].includes(g.marks && g.marks[k]) ? g.marks[k] : "bad")), earned: Number(g.earned) || 0 };
      });
      vsShowResult(seatOk(msg.w) && vs.guesses[msg.w] ? msg.w : -1, str(msg.msg));
      break;
    }
    case "skip":
      if (msg.key !== state.trackKey || state.revealed) break;
      state.track = cleanTrack(msg.track);
      finish("skipped — no contest", false, "skipped");
      break;
    case "full":
      net.synced = net.closedByHost = true;
      setStatus("that room's full — " + MAX_PLAYERS + " players max");
      break;
    case "bye":
      net.closedByHost = true;
      setStatus(pname(0) + " closed the room");
      break;
  }
}

async function startGuest(code, jam) {
  net.role = "guest"; net.code = code; net.jam = jamUrl(jam);
  net.myName = localPlayers()[1].name;
  state.mode = "guest";
  vs.on = true;
  vs.players = [{ name: "", points: 0, wins: 0 }]; // the host's seat, until they say hello
  els.app.classList.add("vs", "guest");
  els.imodes.forEach((b) => { b.disabled = true; });
  setConn("wait", "no Spotify needed — the host is playing");
  setStatus("joining room " + code + "…");
  renderNet();
  try { await loadPeerJs(); } catch (e) { setStatus("can't go online — " + e.message); return; }
  const peer = new Peer(undefined, peerOptions());
  net.peer = peer;
  peer.on("open", () => {
    const conn = peer.connect("gtt-" + code, { reliable: true, metadata: { id: deviceId() } });
    net.conn = conn;
    conn.on("open", () => {
      setConn("on", "listening along with the host");
      setStatus("joined — waiting for the next song");
      const askSync = () => { if (!net.synced && net.conn === conn && conn.open) { netSend({ t: "sync", name: net.myName }); setTimeout(askSync, 2500); } };
      askSync();
      renderNet();
    });
    conn.on("data", (msg) => { try { onGuestData(msg); } catch (e) { console.error("[gtt] bad message", e); } });
    conn.on("close", () => {
      setConn("off", "disconnected"); renderNet();
      if (!net.closedByHost) setStatus("lost the room — reload the invite to rejoin");
    });
  });
  peer.on("error", (e) => {
    console.error("[gtt] peer error", e.type, e);
    if (e.type === "peer-unavailable") setStatus("no room " + code + " — check the invite");
    else setStatus("connection problem (" + e.type + ") — reload to retry");
    renderNet();
  });
}

let tabId = null;
function deviceId() {
  try {
    let id = localStorage.getItem("gtt_device");
    if (!id) { id = makeCode() + makeCode(); localStorage.setItem("gtt_device", id); }
    return id;
  } catch { return tabId ||= "t" + makeCode() + makeCode(); } // no storage: still unique, so nobody steals a seat
}

// WebRTC can take ~30s to notice a closed tab, so say goodbye explicitly
addEventListener("pagehide", () => netSend({ t: "bye" }));

function leaveRoom() {
  if (net.peer) net.peer.destroy();
  location.href = location.pathname;
}

els.jamLink.addEventListener("input", () => {
  const v = els.jamLink.value.trim(), url = jamUrl(v);
  els.jamLink.classList.toggle("ok", !!url);
  els.jamLink.classList.toggle("bad", !!v && !url);
  if (net.role !== "host" || url === net.jam || (v && !url)) return;
  net.jam = url;
  netSend({ t: "jam", url });
  if (url) setStatus(netLinked() ? "Jam link sent to everyone in the room" : "Jam link added to the invite");
});

els.netBtn.onclick = () => {
  if (net.role === "guest") leaveRoom();
  else if (net.role === "host") stopHosting();
  else startHosting();
};
els.netInvite.onclick = async () => {
  const url = inviteUrl();
  const nav = els.app.ownerDocument.defaultView.navigator;
  try {
    if (nav.share && matchMedia("(pointer: coarse)").matches) await nav.share({ title: "Guess the Track", text: "Join my Guess the Track room" + (net.jam ? " — the Spotify Jam button is inside" : ""), url });
    else { await nav.clipboard.writeText(url); setStatus("invite link copied — drop it in the Jam chat, up to " + (MAX_PLAYERS - 1) + " friends can join"); }
  } catch {
    setStatus("invite: " + url);
  }
};

// ---------- public rooms: a serverless lobby on well-known PeerJS ids ----------
// a public room also claims one of LOBBY_SLOTS lobby ids and answers anyone who knocks with
// what's on; the room browser knocks on every slot and lists whoever answers

function setPublic(on) {
  pub.on = on && net.role === "host";
  if (pub.on) {
    if (useFirebase) fbList(); else claimSlot(0, Math.floor(Math.random() * LOBBY_SLOTS));
  } else dropSlot();
  renderJam();
}

function dropSlot() {
  if (pub.peer) pub.peer.destroy();
  pub.peer = null; pub.slot = -1; pub.listed = false;
  fbUnlist();
}

// try slots from a random start so two hosts don't fight over slot 0
function claimSlot(tries, start) {
  dropSlot();
  if (!pub.on || net.role !== "host") return;
  if (tries >= LOBBY_SLOTS) {
    pub.on = false; renderJam();
    setStatus("the public lobby is full — share the invite link instead");
    return;
  }
  const slot = (start + tries) % LOBBY_SLOTS;
  const peer = new Peer(lobbyId(slot), peerOptions());
  pub.peer = peer;
  peer.on("open", () => {
    if (pub.peer !== peer) return;
    pub.slot = slot; pub.listed = true; renderJam();
    console.log("[gtt] listed publicly in slot", slot);
    setStatus("room listed — anyone can find it under VS → 🌍 Find");
  });
  // a message sent the instant a channel opens can get lost, so the browser keeps asking until it hears back
  peer.on("connection", (conn) => {
    conn.on("open", () => { sendTo(conn, roomInfo()); setTimeout(() => conn.close(), 4000); });
    conn.on("data", (m) => { if (m && m.t === "who") sendTo(conn, roomInfo()); });
  });
  peer.on("disconnected", () => { if (pub.peer === peer && !peer.destroyed) peer.reconnect(); });
  peer.on("error", (e) => {
    if (pub.peer !== peer) return;
    if (e.type === "unavailable-id") { claimSlot(tries + 1, start); return; }
    console.error("[gtt] lobby error", e.type, e);
    if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "browser-incompatible") {
      pub.on = false; dropSlot(); renderJam();
      setStatus("couldn't list the room (" + e.type + ")");
    }
  });
}

function roomInfo() {
  return {
    t: "room", v: 1, code: net.code, name: pname(0), imode: state.imode, jam: net.jam,
    players: vs.players.filter((p, i) => present(i)).length, full: vs.players.length >= MAX_PLAYERS,
  };
}

function cleanRoom(m) {
  if (!m || typeof m !== "object" || m.t !== "room") return null;
  const code = str(m.code, 8).toUpperCase();
  if (!/^[A-Z0-9]{4,8}$/.test(code)) return null;
  return {
    code, name: str(m.name, 12).trim() || "someone", jam: jamUrl(m.jam), imode: m.imode === "pick" ? "pick" : "type",
    players: Math.max(1, Math.min(MAX_PLAYERS, Math.floor(Number(m.players)) || 1)), full: !!m.full,
  };
}

async function scanRooms() {
  if (useFirebase) return fbWatchRooms();
  if (lobby.scanning) return;
  lobby.rooms.clear(); lobby.error = ""; lobby.scanning = true;
  renderLobby();
  try { await loadPeerJs(); } catch (e) { lobby.scanning = false; lobby.error = "can't look for rooms — " + e.message; renderLobby(); return; }
  const peer = new Peer(undefined, peerOptions());
  lobby.peer = peer;
  const pending = new Set();
  let timer = 0;
  const done = () => {
    if (lobby.peer !== peer) return;
    clearTimeout(timer);
    lobby.peer = null; lobby.scanning = false;
    setTimeout(() => peer.destroy(), 500);
    renderLobby();
  };
  const settle = (i) => { pending.delete(i); if (!pending.size) done(); };
  peer.on("open", () => {
    for (let i = 0; i < LOBBY_SLOTS; i++) {
      pending.add(i);
      const conn = peer.connect(lobbyId(i), { reliable: true });
      let ask = 0;
      conn.on("open", () => {
        const who = () => { if (conn.open && pending.has(i)) { sendTo(conn, { t: "who" }); ask = setTimeout(who, 600); } };
        who();
      });
      conn.on("data", (m) => {
        const room = cleanRoom(m);
        if (!room) return;
        clearTimeout(ask);
        if (lobby.peer === peer) { lobby.rooms.set(room.code, room); renderLobby(); }
        settle(i); conn.close();
      });
      conn.on("close", () => { clearTimeout(ask); settle(i); });
    }
    // empty slots report back once the PeerJS server gives up on them (~5s); this catches a slot whose WebRTC never connects
    timer = setTimeout(done, 8000);
  });
  peer.on("error", (e) => {
    const m = /gtt-lobby-v1-(\d+)/.exec(e.message || "");
    if (e.type === "peer-unavailable") { if (m) settle(Number(m[1])); return; } // empty slot
    console.error("[gtt] lobby scan error", e.type, e);
    lobby.error = "couldn't reach the lobby (" + e.type + ")";
    done();
  });
}

function joinUrl(code, jam) {
  return location.pathname + "?join=" + code + (jam ? "&jam=" + encodeURIComponent(jam) : "");
}

function renderLobby() {
  els.lobby.classList.toggle("show", lobby.open);
  els.roomsBtn.setAttribute("aria-pressed", String(lobby.open));
  if (!lobby.open) return;
  els.lobbyRefresh.disabled = lobby.scanning;
  els.lobbyRefresh.hidden = useFirebase; // the Firebase list is live
  els.lobbyLogin.hidden = state.mode !== "lobby";
  els.lobbyClose.hidden = state.mode === "lobby"; // nothing else to do here without Spotify
  const rooms = [...lobby.rooms.values()].sort((a, b) => b.players - a.players);
  els.lobbyList.replaceChildren(...rooms.map((r) => {
    const row = document.createElement("div");
    row.className = "room";
    const txt = document.createElement("div");
    const name = document.createElement("b");
    name.textContent = r.name + "'s room";
    const meta = document.createElement("span");
    meta.textContent = r.players + (r.players === 1 ? " player" : " playing") + " · " + (r.imode === "pick" ? "Pick 5" : "Type")
      + " · " + (r.jam ? "🎧 Jam" : "no Jam yet");
    txt.append(name, meta);
    const b = document.createElement("button");
    b.type = "button";
    const mine = net.role === "host" && r.code === net.code;
    b.textContent = mine ? "Yours" : r.full ? "Full" : "Join";
    b.disabled = mine || r.full;
    b.onclick = () => { if (net.peer) net.peer.destroy(); location.href = joinUrl(r.code, r.jam); };
    row.append(txt, b);
    return row;
  }));
  els.lobbyNote.textContent = lobby.scanning ? "looking for rooms…" : lobby.error
    || (rooms.length ? "" : "no public rooms right now — host one: VS → Host → 🌍");
  els.lobbyNote.hidden = !els.lobbyNote.textContent;
}

function setLobbyOpen(open) {
  lobby.open = open;
  renderLobby();
  if (open) scanRooms(); else fbUnwatchRooms();
}

// ---------- public rooms on Firebase (when FIREBASE is filled in) ----------
// rooms/<code> holds what roomInfo() says; the host owns its entry through an anonymous
// sign-in, and the database deletes it by itself the moment the host's connection drops
const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/12.19.0/";
let fbLib = null, fbUser = null;
function loadFirebase() {
  return fbLib ||= Promise.all(["app", "auth", "database"].map((m) => import(FIREBASE_SDK + "firebase-" + m + ".js")))
    .then(([app, auth, db]) => {
      const fa = app.initializeApp(FIREBASE);
      return { auth, db, fa, root: db.getDatabase(fa) };
    })
    .catch((e) => { fbLib = null; throw new Error("couldn't load Firebase"); });
}

// only a host listing a room signs in; browsing the list needs no account
function firebaseUser(fb) {
  return fbUser ||= fb.auth.signInAnonymously(fb.auth.getAuth(fb.fa)).then((c) => c.user.uid)
    .catch((e) => { fbUser = null; throw e; });
}

function fbRoom(uid) {
  const r = roomInfo();
  return {
    uid, name: r.name.slice(0, 12), imode: r.imode, jam: r.jam || null, players: r.players, full: r.full,
    at: pub.fb.db.serverTimestamp(),
  };
}

async function fbList() {
  const code = net.code;
  try {
    const fb = await loadFirebase();
    const uid = await firebaseUser(fb);
    if (!pub.on || net.code !== code || pub.fb) return;
    const room = fb.db.ref(fb.root, "rooms/" + code);
    pub.fb = { db: fb.db, room, uid, sent: "", timer: 0, unwatch: null };
    const me = pub.fb;
    // (re)write the entry every time the connection comes up: a dropped connection already deleted it
    me.unwatch = fb.db.onValue(fb.db.ref(fb.root, ".info/connected"), async (snap) => {
      if (!snap.val() || pub.fb !== me) return;
      try {
        await fb.db.onDisconnect(room).remove();
        const data = fbRoom(uid);
        await fb.db.set(room, data);
        if (pub.fb !== me) return;
        me.sent = fbKey(data);
        if (!pub.listed) {
          pub.listed = true; renderJam();
          console.log("[gtt] listed publicly on Firebase", code);
          setStatus("room listed — anyone can find it under VS → 🌍 Find");
        }
      } catch (e) { fbListFailed(me, e); }
    });
  } catch (e) { fbListFailed(pub.fb, e); }
}

function fbListFailed(me, e) {
  console.error("[gtt] Firebase listing error", e);
  if (pub.fb !== me || !pub.on) return;
  pub.on = false; dropSlot(); renderJam();
  setStatus("couldn't list the room (" + (e.code || e.message) + ")");
}

function fbUnlist() {
  const me = pub.fb;
  if (!me) return;
  pub.fb = null;
  clearTimeout(me.timer);
  if (me.unwatch) me.unwatch();
  me.db.onDisconnect(me.room).cancel().catch(() => {});
  me.db.remove(me.room).catch(() => {});
}

const fbKey = (d) => JSON.stringify({ ...d, at: 0 });

// players, names and the Jam link change while a room's listed; batch them into one write
function fbSyncSoon() {
  const me = pub.fb;
  if (!me || !pub.listed || me.timer) return;
  me.timer = setTimeout(() => {
    me.timer = 0;
    if (pub.fb !== me || net.role !== "host") return;
    const data = fbRoom(me.uid), key = fbKey(data);
    if (key === me.sent) return;
    me.sent = key;
    me.db.set(me.room, data).catch((e) => console.error("[gtt] Firebase update error", e));
  }, 500);
}

async function fbWatchRooms() {
  fbUnwatchRooms();
  lobby.rooms.clear(); lobby.error = ""; lobby.scanning = true;
  renderLobby();
  let fb;
  try { fb = await loadFirebase(); } catch (e) { lobby.scanning = false; lobby.error = "can't look for rooms — " + e.message; renderLobby(); return; }
  if (!lobby.open || lobby.unwatch) return;
  const rooms = fb.db.query(fb.db.ref(fb.root, "rooms"), fb.db.limitToLast(100));
  lobby.unwatch = fb.db.onValue(rooms, (snap) => {
    lobby.rooms.clear();
    snap.forEach((c) => {
      const room = cleanRoom({ ...c.val(), t: "room", code: c.key });
      if (room) lobby.rooms.set(room.code, room);
    });
    lobby.scanning = false; lobby.error = "";
    renderLobby();
  }, (e) => {
    console.error("[gtt] Firebase lobby error", e);
    lobby.unwatch = null; lobby.scanning = false;
    lobby.error = "couldn't reach the lobby (" + (e.code || e.message) + ")";
    renderLobby();
  });
}

function fbUnwatchRooms() {
  if (lobby.unwatch) lobby.unwatch();
  lobby.unwatch = null;
}

els.pubBtn.onclick = () => setPublic(!pub.on);
els.roomsBtn.onclick = () => setLobbyOpen(!lobby.open);
els.lobbyRefresh.onclick = scanRooms;
els.lobbyClose.onclick = () => setLobbyOpen(false);
els.lobbyLogin.onclick = () => { location.href = location.pathname; };

const params = new URL(location.href).searchParams;
const joinCode = params.get("join");
if (joinCode) startGuest(joinCode.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8), params.get("jam"));
else if (params.has("rooms")) {
  // browse without logging in to Spotify: joining a room doesn't need it
  state.mode = "lobby";
  els.app.classList.add("lobby");
  setConn("off", "not logged in — joining doesn't need Spotify");
  setStatus("pick a room to join");
  setLobbyOpen(true);
} else startSpotify();
renderNet();
</script>
</body>
</html>
