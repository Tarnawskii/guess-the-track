<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guess The Track</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: #0c0d10;
    background-image:
      radial-gradient(60rem 30rem at 15% -10%, rgba(64, 96, 255, 0.18), transparent 60%),
      radial-gradient(50rem 28rem at 110% 110%, rgba(30, 215, 96, 0.10), transparent 60%),
      radial-gradient(40rem 24rem at 90% -20%, rgba(170, 82, 255, 0.10), transparent 60%);
    background-attachment: fixed;
    color: #eef0f4;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 12px;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    width: 100%; max-width: 340px;
    background: rgba(255, 255, 255, 0.055);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-top-color: rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 {
    font-size: 12px; font-weight: 700; letter-spacing: 3px;
    background: linear-gradient(90deg, #eef0f4, #9aa3b5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hbtns { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
    background: rgba(255, 255, 255, 0.08);
    color: #eef0f4; border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 10px; padding: 6px 10px;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: default; }
  #cover {
    height: 120px; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px; overflow: hidden;
    font-size: 44px; font-weight: 800;
    background-image: linear-gradient(135deg, rgba(64, 96, 255, 0.25), rgba(30, 215, 96, 0.15));
    color: rgba(255, 255, 255, 0.75);
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
  }
  #cover img { width: 100%; height: 100%; object-fit: cover; }
  .bar {
    height: 5px; border-radius: 3px; overflow: hidden;
    background: rgba(255, 255, 255, 0.08);
  }
  .bar div {
    height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, #1ed760, #5ce08a);
    transition: width 1s linear;
  }
  input {
    font: inherit; font-size: 13px; width: 100%;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.10);
    color: #eef0f4; border-radius: 10px; padding: 9px 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder { color: #6f7683; }
  input:focus {
    outline: none;
    border-color: rgba(30, 215, 96, 0.55);
    box-shadow: 0 0 0 3px rgba(30, 215, 96, 0.15);
  }
  .chips { display: flex; gap: 5px; }
  .chip {
    flex: 1; text-align: center; font-size: 10px; font-weight: 600;
    padding: 5px 0; border-radius: 8px;
    background: rgba(255, 255, 255, 0.05); color: #6f7683;
    border: 1px solid transparent;
    transition: all 0.2s;
  }
  .chip.ok { background: rgba(30, 215, 96, 0.16); color: #5ce08a; border-color: rgba(30, 215, 96, 0.35); }
  .chip.close { background: rgba(255, 200, 60, 0.14); color: #ffd97a; border-color: rgba(255, 200, 60, 0.3); }
  .chip.bad { background: rgba(255, 80, 110, 0.14); color: #ff8aa5; border-color: rgba(255, 80, 110, 0.3); }
  .actions { display: flex; gap: 6px; }
  .actions button { flex: 1; padding: 9px 0; font-size: 11px; }
  #check {
    background: #1ed760; color: #06130a; border: none; font-weight: 700;
    box-shadow: 0 4px 16px rgba(30, 215, 96, 0.35);
  }
  #check:hover { background: #25e56b; }
  #status { font-size: 11px; color: #8b93a1; min-height: 14px; text-align: center; }
  #score { font-size: 11px; font-weight: 600; color: #b6bcc8; text-align: center; letter-spacing: 0.5px; }
  #answer {
    font-size: 13px; text-align: center; color: #eef0f4; display: none;
    padding: 8px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  footer { font-size: 9px; color: #5a6070; text-align: center; letter-spacing: 1px; }
  #conn { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 1px; color: #8b93a1; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #5a6070; flex: none; transition: background 0.3s; }
  .led.on { background: #1ed760; box-shadow: 0 0 8px rgba(30, 215, 96, 0.8); animation: pulse 2s infinite; }
  .led.demo { background: #ffd97a; box-shadow: 0 0 8px rgba(255, 217, 122, 0.6); animation: pulse 2s infinite; }
  .led.wait { background: #ffd97a; animation: pulse 0.8s infinite; }
  .led.off { background: #ff506e; box-shadow: 0 0 8px rgba(255, 80, 110, 0.7); }
  @keyframes pulse { 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>GUESS THE TRACK</h1>
    <div class="hbtns">
      <button id="modeBtn" title="Cycle spotify / soloist / demo">SPOTIFY</button>
      <button id="pipBtn" title="Pop out as always-on-top widget">⧉ PiP</button>
    </div>
  </header>
  <div id="conn"><span id="led" class="led"></span><span id="connText">offline</span></div>
  <div id="cover">?</div>
  <div class="bar"><div id="progress"></div></div>
  <input id="gArtist" placeholder="artist" autocomplete="off" />
  <input id="gSong" placeholder="song" autocomplete="off" />
  <input id="gYear" placeholder="year" inputmode="numeric" maxlength="4" autocomplete="off" />
  <div class="chips">
    <div class="chip" id="cArtist">artist</div>
    <div class="chip" id="cSong">song</div>
    <div class="chip" id="cYear">year</div>
  </div>
  <div class="actions">
    <button id="check">CHECK</button>
    <button id="reveal">REVEAL</button>
    <button id="skip">SKIP</button>
  </div>
  <div id="status">click SPOTIFY to connect</div>
  <div id="score">rounds 0 · points 0 · streak 0</div>
  <div id="answer"></div>
  <footer>don't look at Spotify</footer>
</div>
<script>
const CONFIG = {
  spotifyClientId: "fb91c824fe804c50a8b4b244288ebc6f",
  soloistWs: "ws://127.0.0.1:9090",
  redirectUri: location.origin + location.pathname,
  scopes: "user-read-currently-playing user-read-playback-state",
  pollMs: 5000,
  demoTrackMs: 45000,
};

const state = {
  mode: "idle",
  track: null,
  trackKey: null,
  revealed: false,
  rounds: 0, points: 0, streak: 0,
  demoStart: 0, demoDuration: 240000,
  token: null, lastPoll: 0, userName: null,
  pos: null, trackDuration: 0,
};

const $ = (id) => document.getElementById(id);

window.addEventListener("error", (e) => {
  console.error("[gtt] JS error:", e.message, "at", e.filename + ":" + e.lineno);
  const s = $("status"); if (s) s.textContent = "error: " + e.message;
});
window.addEventListener("unhandledrejection", (e) => {
  console.error("[gtt] unhandled promise:", e.reason);
  const s = $("status"); if (s) s.textContent = "error: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
console.log("[gtt] script loaded, protocol:", location.protocol, "client id set:", !!document.getElementById("app") && true);
const els = {
  cover: $("cover"), progress: $("progress"), status: $("status"), score: $("score"),
  answer: $("answer"), artist: $("gArtist"), song: $("gSong"), year: $("gYear"),
  cArtist: $("cArtist"), cSong: $("cSong"), cYear: $("cYear"),
  check: $("check"), reveal: $("reveal"), skip: $("skip"),
  pipBtn: $("pipBtn"), modeBtn: $("modeBtn"),
  led: $("led"), connText: $("connText"),
};

function setConn(cls, text) {
  els.led.className = "led " + cls;
  if (text) els.connText.textContent = text;
}

setInterval(() => {
  if (state.mode === "spotify") {
    if (!state.lastPoll) return;
    const age = Math.round((Date.now() - state.lastPoll) / 1000);
    if (age > 15) setConn("off", "stale · " + age + "s");
    else setConn("on", (state.userName ? "live: " + state.userName : "live") + " · " + age + "s");
  }
}, 1000);

const DEMO_TRACKS = [
  { artist: "a-ha", song: "Take On Me", year: 1985 },
  { artist: "Nirvana", song: "Smells Like Teen Spirit", year: 1991 },
  { artist: "Daft Punk", song: "Get Lucky", year: 2013 },
  { artist: "The Weeknd", song: "Blinding Lights", year: 2019 },
  { artist: "Kate Bush", song: "Running Up That Hill", year: 1985 },
  { artist: "Toto", song: "Africa", year: 1982 },
];

function normalize(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "")
    .replace(/\(.*?\)/g, " ").replace(/\bfeat\.?\b.*$/, " ")
    .replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}

function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[a.length][b.length];
}

function fuzzyMatch(guess, answers) {
  const g = normalize(guess);
  if (!g) return false;
  return answers.some((ans) => {
    const a = normalize(ans);
    if (g === a) return true;
    const d = levenshtein(g, a);
    return d / Math.max(g.length, a.length) <= 0.2;
  });
}

function setChip(chip, verdict) {
  chip.classList.remove("ok", "close", "bad");
  if (verdict) chip.classList.add(verdict);
}

function newRound(track, key) {
  state.track = track; state.trackKey = key; state.revealed = false;
  els.artist.value = ""; els.song.value = ""; els.year.value = "";
  els.answer.style.display = "none"; els.answer.textContent = "";
  [els.cArtist, els.cSong, els.cYear].forEach((c) => setChip(c, null));
  els.cover.textContent = "?";
  els.status.textContent = "new track — guess!";
  if (track.third.label === "album") {
    els.year.placeholder = "album"; els.year.removeAttribute("maxlength"); els.year.removeAttribute("inputmode");
  } else {
    els.year.placeholder = "year"; els.year.setAttribute("maxlength", "4"); els.year.setAttribute("inputmode", "numeric");
  }
  els.cYear.textContent = track.third.label;
}

function answerText() {
  const t = state.track;
  const third = t.third.label === "year" ? `(${t.third.answer})` : `— ${t.third.answer}`;
  return `${t.artists.join(", ")} — "${t.song}" ${third}`;
}

function check() {
  if (!state.track || state.revealed) return;
  const t = state.track;
  const aOk = fuzzyMatch(els.artist.value, t.artists);
  const sOk = fuzzyMatch(els.song.value, [t.song]);
  let thirdOk = null, earned = 0;
  if (t.third.label === "album") {
    thirdOk = fuzzyMatch(els.year.value, [t.third.answer]);
    if (thirdOk) earned += 1;
  } else {
    const yv = parseInt(els.year.value, 10);
    if (!isNaN(yv)) {
      const diff = Math.abs(yv - t.third.answer);
      if (diff === 0) { thirdOk = "ok"; earned += 2; }
      else if (diff <= 2) { thirdOk = "close"; earned += 1; }
      else thirdOk = "bad";
    }
  }
  if (aOk) earned += 1;
  if (sOk) earned += 1;
  setChip(els.cArtist, aOk ? "ok" : "bad");
  setChip(els.cSong, sOk ? "ok" : "bad");
  if (thirdOk) setChip(els.cYear, thirdOk === true ? "ok" : thirdOk);
  const complete = aOk && sOk && thirdOk;
  if (complete) {
    state.rounds += 1; state.points += earned;
    state.streak = state.streak + 1;
    finish(`nailed it! +${earned}`);
  } else if (earned > 0) {
    els.status.textContent = `partial: +${earned} — fix the red ones`;
  } else {
    els.status.textContent = "nope. try again or reveal";
  }
}

function finish(msg) {
  state.revealed = true;
  els.status.textContent = msg;
  els.score.textContent = `rounds ${state.rounds} · points ${state.points} · streak ${state.streak}`;
  els.answer.textContent = answerText();
  els.answer.style.display = "block";
  if (state.track.artUrl) {
    els.cover.textContent = "";
    const img = document.createElement("img");
    img.src = state.track.artUrl;
    els.cover.textContent = "";
    els.cover.appendChild(img);
  }
}

function reveal() {
  if (!state.track || state.revealed) return;
  state.rounds += 1; state.streak = 0;
  finish("revealed — 0 points");
}

async function startDemo() {
  stopSoloist(); stopSpotify();
  state.mode = "demo";
  setConn("demo", "demo mode");
  els.modeBtn.textContent = "SPOTIFY";
  console.log("[gtt] demo mode started");
  nextDemoTrack();
  state.demoTimer = setInterval(nextDemoTrack, CONFIG.demoTrackMs);
  state.demoTick = setInterval(tickDemoProgress, 1000);
}

function stopDemo() {
  if (state.demoTimer) clearInterval(state.demoTimer);
  if (state.demoTick) clearInterval(state.demoTick);
  state.demoTimer = state.demoTick = null;
}

let soloWs = null;

function stopSoloist() {
  if (state.soloTick) { clearInterval(state.soloTick); state.soloTick = null; }
  if (soloWs) {
    const ws = soloWs; soloWs = null;
    ws.onclose = null;
    try { ws.close(); } catch {}
  }
}

function stopSpotify() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

function startSoloist() {
  if (location.protocol === "https:") { els.status.textContent = "soloist mode only works from the local version"; return; }
  stopDemo(); stopSpotify();
  state.mode = "soloist";
  els.modeBtn.textContent = "DEMO";
  console.log("[gtt] soloist mode started");
  state.soloTick = setInterval(tickSoloistProgress, 1000);
  connectSoloist();
}

function connectSoloist() {
  try { if (soloWs) { const ws = soloWs; soloWs = null; ws.onclose = null; ws.close(); } } catch {}
  setConn("wait", "soloist: connecting…");
  try { soloWs = new WebSocket(CONFIG.soloistWs); } catch { soloRetry(); return; }
  soloWs.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "auth_state") {
      if (m.logged_in) setConn(m.is_active ? "on" : "demo", "soloist: " + (m.device_name || "paired") + (m.is_active ? " · active" : " · idle"));
      else setConn("wait", "soloist: pick device in Spotify app");
    }
    if (m.type === "device_changed") {
      setConn(m.is_active ? "on" : "demo", "soloist: " + (m.device_name || "paired") + (m.is_active ? " · active" : " · idle"));
    }
    if (m.type === "playback_state" || m.type === "track_changed") applySoloist(m);
    if (m.type === "position_sync") state.pos = m.position;
  };
  soloWs.onclose = soloRetry;
  soloWs.onerror = () => {};
}

function soloRetry() {
  if (state.mode !== "soloist") return;
  setConn("off", "soloist: offline — retrying");
  setTimeout(() => { if (state.mode === "soloist") connectSoloist(); }, 3000);
}

function applySoloist(m) {
  const item = m.item;
  if (!item || !item.uri || (item.entity_type !== "track" && item.entity_type !== "episode")) {
    if (m.status === "idle" || m.status === "paused") els.status.textContent = m.status === "paused" ? "paused — hit play" : "idle";
    return;
  }
  const d = item.decorations || {};
  const artists = (d.creators || [])
    .map((c) => c.entity && c.entity.decorations && c.entity.decorations.identity && c.entity.decorations.identity.name)
    .filter(Boolean);
  const song = (d.identity && d.identity.name) || "";
  const album = d.parent && d.parent.entity && d.parent.entity.decorations && d.parent.entity.decorations.identity
    ? d.parent.entity.decorations.identity.name : "";
  const covers = (d.visual_identity && d.visual_identity.cover) || [];
  const art = (covers.find((c) => c.size === "large") || covers[0] || {}).url || null;
  state.trackDuration = (d.playback && d.playback.duration_ms) || 0;
  state.pos = m.position || state.pos;
  const track = { artists: artists.length ? artists : [""], song, third: { label: "album", answer: album }, artUrl: art };
  if (item.uri !== state.trackKey) newRound(track, item.uri);
  else state.track = track;
}

function tickSoloistProgress() {
  if (state.mode !== "soloist" || !state.pos || !state.trackDuration) return;
  const elapsed = state.pos.position_ms + (Date.now() - state.pos.timestamp_ms) * (state.pos.speed || 0);
  const p = Math.min(1, Math.max(0, elapsed / state.trackDuration));
  els.progress.style.width = (p * 100).toFixed(1) + "%";
}

function nextDemoTrack() {
  const t = DEMO_TRACKS[Math.floor(Math.random() * DEMO_TRACKS.length)];
  state.demoStart = Date.now();
  state.demoDuration = 240000;
  newRound({ artists: [t.artist], song: t.song, third: { label: "year", answer: t.year }, artUrl: null }, "demo:" + t.song + Math.random());
}

function tickDemoProgress() {
  if (state.mode !== "demo") return;
  const p = Math.min(1, (Date.now() - state.demoStart) / state.demoDuration);
  els.progress.style.width = (p * 100).toFixed(1) + "%";
  if (p >= 1) nextDemoTrack();
}

async function api(url) {
  const res = await fetch(url, { headers: { Authorization: "Bearer " + state.token } });
  if (res.status === 401 && await refreshAccessToken()) return api(url);
  return res;
}

async function pollSpotify() {
  if (state.mode !== "spotify") return;
  try {
    const res = await api("https://api.spotify.com/v1/me/player/currently-playing");
    if (res.status === 204) { els.status.textContent = "nothing playing…"; state.lastPoll = Date.now(); return; }
    if (!res.ok) { setConn("off", "error " + res.status); return; }
    state.lastPoll = Date.now();
    const data = await res.json();
    if (!data || !data.item) { console.log("[gtt] poll ok, no item"); return; }
    console.log("[gtt] poll ok, item:", data.item.id, "playing:", !!data.is_playing);
    const item = data.item;
    const track = {
      artists: item.artists.map((a) => a.name),
      song: item.name,
      third: { label: "year", answer: parseInt((item.album.release_date || "0").slice(0, 4), 10) },
      artUrl: (item.album.images && item.album.images[0]) ? item.album.images[0].url : null,
    };
    const key = item.id;
    if (key !== state.trackKey) newRound(track, key);
    if (item.duration_ms) {
      const p = Math.min(1, (data.progress_ms || 0) / item.duration_ms);
      els.progress.style.width = (p * 100).toFixed(1) + "%";
    }
  } catch (e) {
    els.status.textContent = "connection glitch — retrying";
    setConn("off", "offline");
  }
}

async function startSpotify() {
  if (!CONFIG.spotifyClientId) {
    els.status.textContent = "set spotifyClientId in CONFIG (top of file)";
    console.error("[gtt] no client id configured");
    return;
  }
  const url = new URL(location.href);
  const code = url.searchParams.get("code");
  console.log("[gtt] startSpotify: code on url:", !!code, "storage url:", localStorage.getItem("pip_widget_auth") ? "token cached" : "no token");
  if (code) {
    history.replaceState(null, "", location.pathname);
    console.log("[gtt] exchanging code for token…");
    await exchangeCode(code);
  } else if (!loadToken()) {
    console.log("[gtt] no token, redirecting to spotify login");
    await redirectToSpotify();
    return;
  }
  state.mode = "spotify";
  stopDemo(); stopSoloist();
  setConn("wait", "connecting…");  try {
    const me = await api("https://api.spotify.com/v1/me");
    if (me.ok) { const u = await me.json(); state.userName = u.display_name || u.id; }
  } catch {}
  els.modeBtn.textContent = location.protocol === "http:" ? "SOLOIST" : "DEMO";
  console.log("[gtt] spotify mode starting");
  stopDemo();
  pollSpotify();
  state.pollTimer = setInterval(pollSpotify, CONFIG.pollMs);
  els.status.textContent = "listening…";
}

function loadToken() {
  try {
    const raw = localStorage.getItem("pip_widget_auth");
    if (!raw) return false;
    const auth = JSON.parse(raw);
    if (auth.expiresAt && Date.now() > auth.expiresAt - 30000) return false;
    state.token = auth.access;
    return true;
  } catch { return false; }
}

async function saveAuth(auth) {
  state.token = auth.access_token;
  localStorage.setItem("pip_widget_auth", JSON.stringify({
    access: auth.access_token,
    refresh: auth.refresh_token,
    expiresAt: Date.now() + (auth.expires_in || 3600) * 1000,
  }));
}

async function redirectToSpotify() {
  const verifier = btoa(crypto.getRandomValues(new Uint8Array(48)).toString("latin1"))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  sessionStorage.setItem("pip_widget_verifier", verifier);
  const q = new URLSearchParams({
    client_id: CONFIG.spotifyClientId,
    response_type: "code",
    redirect_uri: CONFIG.redirectUri,
    scope: CONFIG.scopes,
    code_challenge_method: "S256",
    code_challenge: challenge,
  });
  location.href = "https://accounts.spotify.com/authorize?" + q.toString();
}

async function exchangeCode(code) {
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      grant_type: "authorization_code",
      code,
      redirect_uri: CONFIG.redirectUri,
      client_id: CONFIG.spotifyClientId,
      code_verifier: sessionStorage.getItem("pip_widget_verifier") || "",
    }),
  });
  if (res.ok) await saveAuth(await res.json());
  else {
    const body = await res.text();
    console.error("[gtt] token exchange failed:", res.status, body);
    els.status.textContent = "auth failed (" + res.status + ") — check console";
  }
}

async function refreshAccessToken() {
  try {
    const raw = localStorage.getItem("pip_widget_auth");
    if (!raw) return false;
    const auth = JSON.parse(raw);
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "refresh_token",
        refresh_token: auth.refresh,
        client_id: CONFIG.spotifyClientId,
      }),
    });
    if (!res.ok) return false;
    await saveAuth(await res.json());
    return true;
  } catch { return false; }
}

els.modeBtn.onclick = () => {
  if (state.mode === "idle" || state.mode === "demo") startSpotify();
  else if (state.mode === "spotify" && location.protocol === "http:") startSoloist();
  else startDemo();
};
els.check.onclick = check;
els.reveal.onclick = reveal;
els.skip.onclick = () => {
  if (state.mode === "demo") { nextDemoTrack(); return; }
  if (!state.revealed && state.track) { state.rounds += 1; state.streak = 0; finish("skipped"); }
  if (state.mode === "soloist" && soloWs && soloWs.readyState === 1) {
    try { soloWs.send(JSON.stringify({ type: "command", command: "skip_next" })); } catch {}
  }
};
els.year.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
els.song.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
els.artist.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });

async function togglePip() {
  if (!("documentPictureInPicture" in window)) {
    els.status.textContent = "Chrome/Edge only — no Document PiP here";
    return;
  }
  if (documentPictureInPicture.window) {
    documentPictureInPicture.window.close();
    return;
  }
  const pipWindow = await documentPictureInPicture.requestWindow({ width: 360, height: 560 });
  for (const sheet of document.styleSheets) {
    try {
      const style = pipWindow.document.createElement("style");
      style.textContent = Array.from(sheet.cssRules).map((r) => r.cssText).join("\n");
      pipWindow.document.head.appendChild(style);
    } catch {}
  }
  pipWindow.document.body.appendChild(document.getElementById("app"));
  pipWindow.addEventListener("pagehide", () => {
    document.body.appendChild(document.getElementById("app"));
  });
}
els.pipBtn.onclick = togglePip;

if (new URL(location.href).searchParams.has("code")) startSpotify();
</script>
